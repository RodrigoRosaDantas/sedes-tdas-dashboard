<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101b"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>TDAS — Técnico Administrativo | SEDES/DF</title><style>html,body{margin:0;height:100%;background:#07101b;color:#edf7ff;font-family:system-ui,sans-serif}.load{height:100%;display:grid;place-items:center;text-align:center}.spin{width:42px;height:42px;border:4px solid #29415e;border-top-color:#42d5ab;border-radius:50%;animation:s .8s linear infinite;margin:auto auto 18px}@keyframes s{to{transform:rotate(360deg)}}small{color:#93a8c0}</style></head><body><div class="load"><div><div class="spin"></div><b>Carregando Dashboard SEDES/DF</b><br><small>Validando a versão estável…</small></div></div><script>(async()=>{try{let src=await fetch('app.html?v=17',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Falha '+r.status);return r.text()});const marker="html=html.replace(/Atualização diária às 7h/g,'Sincronização 4× ao dia');";const patch=marker+"html=html.replace('Seu painel estratégico de preparação para a SEDES/DF.','TDAS — Técnico Administrativo | SEDES/DF').replace('Acompanhe sua evolução, identifique gargalos e priorize o que mais aumenta sua chance de aprovação. Os dados completos continuam disponíveis para auditoria sempre que você precisar.','Cada ciclo concluído aproxima você da aprovação e da estabilidade que está construindo para sua família. Continue avançando com constância, foco e estratégia.');";if(!src.includes(marker))throw new Error('Versão-base incompatível');src=src.replace(marker,patch);document.open();document.write(src);document.close()}catch(e){document.body.innerHTML='<div class="load"><div><b>Não foi possível carregar o dashboard.</b><br><small>'+e.message+'</small></div></div>'}})();</script></body></html>
