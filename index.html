<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101b"><title>SEDES/DF TDAS — Dashboard</title><style>html,body{margin:0;height:100%;background:#07101b;color:#edf7ff;font-family:system-ui,sans-serif}.load{height:100%;display:grid;place-items:center;text-align:center}.spin{width:42px;height:42px;border:4px solid #29415e;border-top-color:#42d5ab;border-radius:50%;animation:s .8s linear infinite;margin:auto auto 18px}@keyframes s{to{transform:rotate(360deg)}}small{color:#93a8c0}</style></head><body><div class="load"><div><div class="spin"></div><b>Carregando Dashboard SEDES/DF</b><br><small>Sincronizando o painel publicado…</small></div></div><script>(async()=>{try{const n=4;const ps=await Promise.all(Array.from({length:n},(_,i)=>fetch(`chunks/part${String(i).padStart(2,'0')}.txt?v=9`).then(r=>{if(!r.ok)throw new Error('Falha '+r.status);return r.text()})));const bin=atob(ps.join(''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();html=html.replace('Um cockpit de estudo, não uma planilha comprida.','Seu painel estratégico de preparação para a SEDES/DF.').replace('Os resultados aparecem primeiro em gráficos e sinais de decisão. As bases completas ficam recolhidas para auditoria. Tudo continua pré-preenchido no HTML, mesmo quando o visualizador bloqueia JavaScript.','Acompanhe sua evolução, identifique gargalos e priorize o que mais aumenta sua chance de aprovação. Os dados completos continuam disponíveis para auditoria sempre que você precisar.');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><div><b>Não foi possível carregar o dashboard.</b><br><small>'+e.message+'</small></div></div>'}})();</script></body></html>
