<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SEDES/DF TDAS — Dashboard Executivo</title><style>html,body{margin:0;height:100%;background:#07101d;color:#f2f7fc;font-family:system-ui,sans-serif}.load{height:100%;display:grid;place-items:center;text-align:center}.spin{width:42px;height:42px;border:4px solid #29415e;border-top-color:#39c99f;border-radius:50%;animation:s .8s linear infinite;margin:auto auto 18px}@keyframes s{to{transform:rotate(360deg)}}small{color:#8ea4bc}</style></head><body><div class="load"><div><div class="spin"></div><b>Carregando Dashboard Executivo SEDES/DF</b><br><small>Sincronizando dados e indicadores…</small></div></div><script>(async()=>{try{const n=4;const ps=await Promise.all(Array.from({length:n},(_,i)=>fetch(`chunks/part${String(i).padStart(2,'0')}.txt?v=10`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Falha '+r.status);return r.text()})));const bin=atob(ps.join(''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><div><b>Não foi possível carregar o dashboard.</b><br><small>'+e.message+'</small></div></div>'}})();</script></body></html>
