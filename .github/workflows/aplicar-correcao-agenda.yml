name: Aplicar correção da agenda futura

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-correcao-agenda.yml'

permissions:
  contents: write

concurrency:
  group: corrigir-agenda-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Separar histórico e planejamento pela data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/notion/build.mjs')
          source = path.read_text(encoding='utf-8')
          old = """  const actualControls = sortedControls.filter(item => started(item.status));
            const futureControls = sortedControls.filter(item => !started(item.status));"""
          new = """  const actualControls = sortedControls.filter(item => started(item.status) || Boolean(item.date && item.date < date));
            const futureControls = sortedControls.filter(item => !started(item.status) && Boolean(item.date && item.date >= date)).sort(byDate);"""
          if old not in source:
              raise SystemExit('Regra atual de partição não localizada.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validar plataforma integralmente
        run: npm run check

      - name: Consolidar código validado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/notion/build.mjs
          git commit -m 'Separar histórico e agenda futura pela data'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
