name: Aplicar reconstrução após mudanças técnicas

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-regeneracao-tecnica.yml'

permissions:
  contents: write

concurrency:
  group: regeneracao-tecnica-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Forçar reconstrução em push técnico
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/sync-notion.mjs')
          source = path.read_text(encoding='utf-8')
          import_anchor = "import { build } from './notion/build.mjs';"
          import_line = "import { shouldRebuild } from './notion/sync-decision.mjs';"
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit('Importação de build não localizada.')
              source = source.replace(import_anchor, f"{import_anchor}\n{import_line}", 1)
          old = "const semanticChanged = previousState.semanticHash !== nextHash;"
          new = """const semanticChanged = shouldRebuild({
            previousHash: previousState.semanticHash,
            nextHash,
            syncKind: process.env.SYNC_KIND || '',
            forceRebuild: process.env.FORCE_REBUILD === 'true'
          });"""
          if old not in source:
              raise SystemExit('Decisão semântica atual não localizada.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validar plataforma integralmente
        run: npm run check

      - name: Consolidar código validado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/sync-notion.mjs
          git commit -m 'Forçar reconstrução após mudanças técnicas'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
