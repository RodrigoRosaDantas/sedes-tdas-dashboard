name: Aplicar correção integral da Lei Seca

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-correcao-lei-seca.yml'

permissions:
  contents: write

concurrency:
  group: corrigir-lei-seca-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Atualizar entradas, cache e regressões
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(file, old, new):
              path = Path(file)
              source = path.read_text(encoding='utf-8')
              if old not in source:
                  raise SystemExit(f'Trecho não localizado em {file}: {old}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once('assets/enhance-v20.js', "daily-execution.js?v=1.0.0", "daily-execution.js?v=1.1.1")
          replace_once('resolver/index.html', 'daily-question-page.js?v=1.0.0', 'daily-question-page.js?v=1.0.1')
          replace_once('hoje/index.html', 'today-execution.js?v=1.0.0', 'today-execution.js?v=1.0.1')
          replace_once('estudar/index.html', 'module-dashboard.js?v=3.0.0', 'module-dashboard.js?v=3.0.1')

          post = Path('scripts/postprocess-v26.mjs')
          source = post.read_text(encoding='utf-8')
          marker = "const subjectSlugs=(subjectsData.subjects||[]).map(item=>item.slug).filter(Boolean),fallbackSlugs="
          if marker not in source:
              raise SystemExit('Ponto de inserção no pós-processamento não localizado.')
          insertion = """for(let number=1;number<=totalPE;number++){
 const file=path.join(ROOT,'pe',String(number),'index.html');
 try{const html=await fs.readFile(file,'utf8');const updated=html.replaceAll('assets/enhance-v20.js?v=20','assets/enhance-v20.js?v=26.1');if(updated!==html)await fs.writeFile(file,updated,'utf8')}catch(error){if(error?.code!=='ENOENT')throw error}
}
"""
          source = source.replace(marker, insertion + marker, 1)
          old_version = "const sw=`const VERSION='tdas-v26-daily-${new Date().toISOString().slice(0,10).replaceAll('-','')}-notion-daily-content';"
          new_version = "const sw=`const VERSION='tdas-v26-daily-${new Date().toISOString().slice(0,10).replaceAll('-','')}-notion-daily-content-law-101';"
          if old_version not in source:
              raise SystemExit('Versão do service worker não localizada.')
          post.write_text(source.replace(old_version, new_version, 1), encoding='utf-8')

          Path('scripts/test-daily-law-integration.mjs').write_text(r'''import assert from 'node:assert/strict';
import fs from 'node:fs';

const read=file=>fs.readFileSync(file,'utf8');
const law=read('assets/integration/daily-law.js');
const execution=read('assets/integration/daily-execution.js');
const resolver=read('resolver/index.html');
const today=read('hoje/index.html');
const study=read('estudar/index.html');
const questionPage=read('assets/integration/daily-question-page.js');
const todayExecution=read('assets/integration/today-execution.js');
const dashboard=read('assets/integration/module-dashboard.js');
const enhance=read('assets/enhance-v20.js');
const postprocess=read('scripts/postprocess-v26.mjs');

assert.ok(!/import\s*\{[^}]*\bBASE\b[^}]*\}\s*from\s*['"]\.\/daily-execution/.test(law),'daily-law não pode importar BASE de daily-execution.');
assert.ok(law.includes("daily-execution.js?v=1.1.1"));
assert.ok(execution.includes("daily-law.js?v=1.0.1"));
assert.ok(questionPage.includes("daily-execution.js?v=1.1.1"));
assert.ok(todayExecution.includes("daily-execution.js?v=1.1.1"));
assert.ok(dashboard.includes("daily-execution.js?v=1.1.1"));
assert.ok(enhance.includes("daily-execution.js?v=1.1.1"));
assert.ok(resolver.includes('daily-question-page.js?v=1.0.1'));
assert.ok(today.includes('today-execution.js?v=1.0.1'));
assert.ok(study.includes('module-dashboard.js?v=3.0.1'));
assert.ok(postprocess.includes('assets/enhance-v20.js?v=26.1'));
assert.ok(postprocess.includes('notion-daily-content-law-101'));
console.log('Integração da Lei Seca validada: import correto, entradas atualizadas e cache invalidado.');
''', encoding='utf-8')

          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          test = 'node scripts/test-daily-law-integration.mjs'
          if test not in data['scripts']['check']:
              data['scripts']['check'] = data['scripts']['check'].replace('node scripts/test-dashboard-freshness.mjs &&', f'node scripts/test-dashboard-freshness.mjs && {test} &&', 1)
          data['scripts']['test:daily-law'] = test
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validar plataforma
        run: npm run check

      - name: Consolidar arquivos permanentes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/enhance-v20.js resolver/index.html hoje/index.html estudar/index.html scripts/postprocess-v26.mjs scripts/test-daily-law-integration.mjs package.json
          git commit -m 'Corrigir carregamento da Lei Seca e invalidar cache'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
