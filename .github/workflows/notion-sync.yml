name: Sincronizar Notion

on:
  workflow_dispatch:
  schedule:
    # 00h50, 06h50, 12h50 e 18h50 no horário de Brasília (UTC-3)
    - cron: '50 3,9,15,21 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/notion-sync.yml'
      - 'scripts/sync-notion.mjs'
      - 'scripts/notion/**'
      - 'scripts/validate-data.mjs'

permissions:
  contents: write

concurrency:
  group: notion-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Consultar Notion e gerar snapshot temporário
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TZ: America/Sao_Paulo
        run: node scripts/sync-notion.mjs

      - name: Validar consistência
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo 'Sem alteração semântica; validação e commit dispensados.'
          else
            node scripts/validate-data.mjs
          fi

      - name: Publicar snapshot validado
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo 'Notion sem mudanças reais.'
            exit 0
          fi
          git config user.name 'tdas-notion-sync[bot]'
          git config user.email 'tdas-notion-sync[bot]@users.noreply.github.com'
          git add data
          git commit -m "Sincronizar dados oficiais do Notion"
          git push origin HEAD:main
