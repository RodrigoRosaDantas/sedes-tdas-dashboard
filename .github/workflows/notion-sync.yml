name: Sincronizar Plataforma TDAS v26

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notion-sync.yml'
      - '.github/tdas-sync-trigger.txt'
      - 'scripts/sync-notion.mjs'
      - 'scripts/sync-notion-mirror.mjs'
      - 'scripts/postprocess-v23.mjs'
      - 'scripts/postprocess-v24.mjs'
      - 'scripts/postprocess-v26.mjs'
      - 'scripts/postprocess-redactions.mjs'
      - 'scripts/record-sync-error.mjs'
      - 'scripts/notion/**'
      - 'scripts/prepare-calendar-refresh.mjs'
      - 'scripts/validate-calendar-snapshot.mjs'
      - 'scripts/validate-daily-content.mjs'
      - 'scripts/validate-redactions-publication.mjs'
      - 'scripts/test-redactions-dashboard.mjs'
      - 'scripts/test-redactions-operational.mjs'
      - 'scripts/test-site-operations.mjs'
      - 'scripts/sync-platform-version.mjs'
      - 'scripts/validate-platform-version.mjs'
      - 'scripts/test-calendar-refresh.mjs'
      - 'scripts/test-daily-content.mjs'
      - 'scripts/test-sync-operational-guards.mjs'
      - 'assets/redactions.js'
      - 'assets/redaction-detail.js'
      - 'assets/redactions-dashboard.css'
      - 'redacoes/**'
      - 'package.json'
  schedule:
    - cron: '50 3,9,15,21 * * *'

permissions:
  contents: write

concurrency:
  group: notion-sync-publication
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar janela do ciclo
        id: cycle
        shell: bash
        run: |
          set -euo pipefail
          today="$(TZ=America/Sao_Paulo date +%F)"
          if [[ "${GITHUB_EVENT_NAME}" == 'schedule' && "$today" > '2026-09-06' ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "Ciclo encerrado em 2026-09-06; sincronização agendada dispensada e último snapshot preservado."
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar branch isolada
        if: steps.cycle.outputs.run == 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tdas-notion-sync[bot]'
          git config user.email 'tdas-notion-sync[bot]@users.noreply.github.com'
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            target="${GITHUB_REF_NAME}"
          else
            target="sync-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch -c "$target"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Consultar, gerar e validar fora do main
        if: steps.cycle.outputs.run == 'true'
        id: prepare
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SYNC_KIND: ${{ github.event_name }}
          TZ: America/Sao_Paulo
        shell: bash
        run: |
          set -uo pipefail
          set +e
          : > /tmp/tdas-sync.log
          node scripts/prepare-calendar-refresh.mjs 2>&1 | tee -a /tmp/tdas-sync.log
          sync_status=${PIPESTATUS[0]}
          if [[ $sync_status -eq 0 ]]; then
            node scripts/sync-notion.mjs 2>&1 | tee -a /tmp/tdas-sync.log
            sync_status=${PIPESTATUS[0]}
          fi
          if [[ $sync_status -eq 0 ]]; then
            node scripts/sync-notion-mirror.mjs 2>&1 | tee -a /tmp/tdas-sync.log
            sync_status=${PIPESTATUS[0]}
          fi
          if [[ $sync_status -eq 0 ]]; then
            node scripts/postprocess-v23.mjs 2>&1 | tee -a /tmp/tdas-sync.log
            sync_status=${PIPESTATUS[0]}
          fi
          if [[ $sync_status -eq 0 ]]; then
            node scripts/postprocess-v24.mjs 2>&1 | tee -a /tmp/tdas-sync.log
            sync_status=${PIPESTATUS[0]}
          fi
          if [[ $sync_status -eq 0 ]]; then
            node scripts/postprocess-v26.mjs 2>&1 | tee -a /tmp/tdas-sync.log
            sync_status=${PIPESTATUS[0]}
          fi
          if [[ $sync_status -eq 0 ]]; then
            node scripts/postprocess-redactions.mjs 2>&1 | tee -a /tmp/tdas-sync.log
            sync_status=${PIPESTATUS[0]}
          fi
          if [[ $sync_status -eq 0 ]]; then
            REQUIRE_REDACTIONS_PUBLICATION=true node scripts/validate-redactions-publication.mjs 2>&1 | tee -a /tmp/tdas-sync.log
            sync_status=${PIPESTATUS[0]}
          fi
          if [[ $sync_status -eq 0 ]]; then
            node scripts/sync-platform-version.mjs 2>&1 | tee -a /tmp/tdas-sync.log
            sync_status=${PIPESTATUS[0]}
          fi
          if [[ $sync_status -eq 0 ]]; then
            REQUIRE_CURRENT_SNAPSHOT=true node scripts/validate-calendar-snapshot.mjs 2>&1 | tee -a /tmp/tdas-sync.log
            sync_status=${PIPESTATUS[0]}
          fi
          if [[ $sync_status -eq 0 ]]; then
            npm run check 2>&1 | tee -a /tmp/tdas-sync.log
            sync_status=${PIPESTATUS[0]}
          fi
          if [[ $sync_status -ne 0 ]]; then
            set -e
            git reset --hard "$GITHUB_SHA"
            export SYNC_ERROR_DETAIL="$(tail -c 4800 /tmp/tdas-sync.log | tr '\n' ' ')"
            node scripts/record-sync-error.mjs
            git add data/sync-history.json
            git commit -m 'Registrar falha de sincronização sem publicar dados'
            git push origin "HEAD:refs/heads/sync-errors/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo 'A publicação foi bloqueada; main permaneceu intacto.'
            exit $sync_status
          fi
          set -e

      - name: Criar conjunto integral validado
        if: steps.cycle.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A data pe materias sw.js
          if git diff --cached --quiet; then
            echo 'Nenhum arquivo foi alterado.'
            exit 0
          fi
          git commit -m 'Sincronizar integralmente a Plataforma TDAS v26'
          git push origin "HEAD:refs/heads/${{ steps.branch.outputs.target }}"

      - name: Promover atomicamente para main
        if: steps.cycle.outputs.run == 'true' && github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
