name: Preparar correções TDAS v20

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: tdas-v20-correction-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v20-sync-corrections-20260729
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar conjunto corrigido
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/.v20-corrections.tar.gz.b64 | tar -xz
          rm scripts/.v20-corrections.tar.gz.b64
          git config user.name 'tdas-notion-sync[bot]'
          git config user.email 'tdas-notion-sync[bot]@users.noreply.github.com'
      - name: Sincronizar e validar na branch isolada
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SYNC_KIND: preparation
          TZ: America/Sao_Paulo
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/tdas-sync.log
          node scripts/sync-notion.mjs 2>&1 | tee -a /tmp/tdas-sync.log
          status=${PIPESTATUS[0]}
          if [[ $status -eq 0 ]]; then
            node scripts/validate-platform.mjs 2>&1 | tee -a /tmp/tdas-sync.log
            status=${PIPESTATUS[0]}
          fi
          if [[ $status -ne 0 ]]; then
            export SYNC_ERROR_DETAIL="$(tail -c 4800 /tmp/tdas-sync.log | tr '\n' ' ')"
            git reset --hard origin/fix/v20-sync-corrections-20260729
            node --input-type=module -e "import fs from 'node:fs/promises';const f='data/sync-history.json';let d={entries:[]};try{d=JSON.parse(await fs.readFile(f,'utf8'))}catch{};d.entries=[{at:new Date().toISOString(),kind:'Preparação isolada',status:'error',summary:'Correções bloqueadas antes da publicação',detail:process.env.SYNC_ERROR_DETAIL},...(d.entries||[])].slice(0,40);await fs.writeFile(f,JSON.stringify(d)+'\n')"
            git add data/sync-history.json
            git commit -m 'Registrar falha isolada de preparação'
            git push origin "HEAD:refs/heads/sync-errors/preparation-${GITHUB_RUN_ID}"
            exit $status
          fi
      - name: Consolidar branch validada
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'Aplicar correções integrais da sincronização TDAS v20'
          git push origin HEAD:fix/v20-sync-corrections-20260729
