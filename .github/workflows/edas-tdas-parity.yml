name: Aplicar paridade TDAS no EDAS

on:
  pull_request:
    branches:
      - main
    paths:
      - edas-migration.ready

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Obter branch do pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruir e aplicar pacote validado
        shell: bash
        run: |
          set -euo pipefail
          cat edas-migration.parts/part*.b64 > /tmp/edas-migration.bundle.b64
          base64 --decode /tmp/edas-migration.bundle.b64 > /tmp/edas-migration.tar.gz
          test "$(sha256sum /tmp/edas-migration.tar.gz | awk '{print $1}')" = "8057aa6da25f3a8dd10caf37b84538a504f23a5a52b7b834cd471c58f5b01649"
          mkdir -p edas-administracao
          tar -xzf /tmp/edas-migration.tar.gz -C edas-administracao

      - name: Validar módulos e dados
        shell: bash
        run: |
          set -euo pipefail
          for file in edas-administracao/assets/*.js edas-administracao/assets/integration/*.js; do node --check "$file"; done
          python -m json.tool edas-administracao/manifest.webmanifest >/dev/null
          python -m json.tool edas-administracao/data/integration/question-catalog.json >/dev/null
          test "$(find edas-administracao -name index.html | wc -l)" -ge 14
          grep -q "20260804.1" edas-administracao/assets/common.js
          grep -q "edas.400.question-module.v2.state" edas-administracao/assets/integration/module-store.js
          ! grep -R "tdas.202.question-module" edas-administracao/assets/integration

      - name: Consolidar branch técnica
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EDAS Platform Bot"
          git config user.email "actions@users.noreply.github.com"
          git add edas-administracao
          git rm -r --ignore-unmatch edas-migration.bundle.b64 edas-migration.parts edas-migration.ready
          git commit -m "Aplicar estrutura e recursos do TDAS ao EDAS v20260804.1"
          git push origin HEAD:${{ github.head_ref }}
