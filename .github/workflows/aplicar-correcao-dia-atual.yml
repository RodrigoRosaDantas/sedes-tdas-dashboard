name: Aplicar correção do dia atual

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-correcao-dia-atual.yml'

permissions:
  contents: write

concurrency:
  group: corrigir-dia-atual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remover sobreposições antigas e corrigir o ciclo atual
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(file, old, new):
              path = Path(file)
              source = path.read_text(encoding='utf-8')
              if old not in source:
                  raise SystemExit(f'Trecho não localizado em {file}: {old[:120]}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          # O dia atual deve considerar descansos passados como ciclos cumpridos.
          replace_once(
              'scripts/notion/build.mjs',
              "const explicitlyPending = status => /nao iniciad|planejad|a fazer|pendente|futuro/.test(norm(status));\nconst started = status => !explicitlyPending(status) && (done(status) || /andamento|parcial|iniciad|objetiva/.test(norm(status)));",
              "const explicitlyPending = status => /nao iniciad|planejad|a fazer|pendente|futuro/.test(norm(status));\nconst rest = item => /descanso|pausa/.test(norm(`${item?.title} ${item?.status} ${item?.typ} ${item?.block}`));\nconst started = status => !explicitlyPending(status) && (done(status) || /andamento|parcial|iniciad|objetiva/.test(norm(status)));"
          )
          replace_once(
              'scripts/notion/build.mjs',
              "  const completedControls = sortedControls.filter(item => done(item.status));",
              "  const completedControls = sortedControls.filter(item => done(item.status) || Boolean(item.date && item.date < date && rest(item)));"
          )

          # A primeira métrica passa a mostrar inequivocamente o PE do dia.
          replace_once(
              'assets/home.js',
              "  ${metric('Ciclo cumprido',`${m.completed}/${m.totalPE}`,`${(m.completed/m.totalPE*100).toFixed(1).replace('.',',')}% do plano · inclui descansos planejados`)}",
              "  ${metric('PE atual',`${d.today.number}/${m.totalPE}`,`${m.completed} ciclos anteriores cumpridos · hoje é ${d.today.pe}`)}"
          )

          # O navegador usa diretamente o snapshot atual, sem camadas históricas.
          replace_once(
              'assets/common.js',
              "export async function loadJSON(path){const r=await fetch(BASE+path,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar dados ('+r.status+')');const data=await r.json();if(path==='data/live-v23.json'||path==='data/live-v24.json')return data;const[legacy,current]=await loadPatches();return patchValue(patchValue(data,legacy[path]),current[path])}",
              "export async function loadJSON(path){const r=await fetch(BASE+path,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar dados ('+r.status+')');return r.json()}"
          )

          # As versões antigas deixam de gerar sobreposições durante a sincronização.
          workflow = Path('.github/workflows/notion-sync.yml')
          source = workflow.read_text(encoding='utf-8')
          source = source.replace(
              "      - 'scripts/sync-notion.mjs'\n",
              "      - 'scripts/sync-notion.mjs'\n      - 'scripts/postprocess-v26.mjs'\n      - 'assets/common.js'\n      - 'assets/home.js'\n      - 'scripts/validate-platform.mjs'\n      - 'data/live-v23.json'\n      - 'data/live-v24.json'\n",
              1
          )
          obsolete = """          if [[ $sync_status -eq 0 ]]; then
            node scripts/postprocess-v23.mjs 2>&1 | tee -a /tmp/tdas-sync.log
            sync_status=${PIPESTATUS[0]}
          fi
          if [[ $sync_status -eq 0 ]]; then
            node scripts/postprocess-v24.mjs 2>&1 | tee -a /tmp/tdas-sync.log
            sync_status=${PIPESTATUS[0]}
          fi
"""
          if obsolete not in source:
              raise SystemExit('Blocos antigos de pós-processamento não localizados.')
          workflow.write_text(source.replace(obsolete, '', 1), encoding='utf-8')

          # O pós-processamento vigente neutraliza overlays e muda a versão do cache
          # sempre que os arquivos efetivamente publicados mudarem.
          replace_once(
              'scripts/postprocess-v26.mjs',
              "import fs from 'node:fs/promises';\nimport path from 'node:path';",
              "import fs from 'node:fs/promises';\nimport path from 'node:path';\nimport crypto from 'node:crypto';"
          )
          replace_once(
              'scripts/postprocess-v26.mjs',
              "const overlay=normalizeVersion(await read('data/live-v24.json',{}));await write('data/live-v24.json',overlay);",
              "await Promise.all([write('data/live-v23.json',{}),write('data/live-v24.json',{})]);"
          )
          replace_once(
              'scripts/postprocess-v26.mjs',
              "const sw=`const VERSION='tdas-v26-daily-${new Date().toISOString().slice(0,10).replaceAll('-','')}-notion-daily-content';",
              "const fingerprintFiles=['assets/common.js','assets/home.js','data/home.json','data/today.json','data/agenda.json','data/live-v23.json','data/live-v24.json'];\nconst fingerprint=crypto.createHash('sha256');\nfor(const file of fingerprintFiles)fingerprint.update(await fs.readFile(path.join(ROOT,file)));\nconst cacheId=fingerprint.digest('hex').slice(0,12);\nconst sw=`const VERSION='tdas-v26-${new Date().toISOString().slice(0,10).replaceAll('-','')}-${cacheId}';"
          )

          # A validação passa a bloquear qualquer sobreposição histórica futura.
          replace_once(
              'scripts/validate-platform.mjs',
              "required(JSON.stringify(await readJson('data/live.json')) === '{}', 'data/live.json contém sobreposição histórica e pode adulterar o snapshot atual.');",
              "required(JSON.stringify(await readJson('data/live.json')) === '{}', 'data/live.json contém sobreposição histórica e pode adulterar o snapshot atual.');\nrequired(JSON.stringify(await readJson('data/live-v23.json')) === '{}', 'data/live-v23.json contém sobreposição histórica e pode adulterar o snapshot atual.');\nrequired(JSON.stringify(await readJson('data/live-v24.json')) === '{}', 'data/live-v24.json contém sobreposição histórica e pode adulterar o snapshot atual.');"
          )

          # Neutralização imediata das camadas já publicadas.
          Path('data/live-v23.json').write_text('{}\n', encoding='utf-8')
          Path('data/live-v24.json').write_text('{}\n', encoding='utf-8')

          # Teste de regressão do dia atual e das camadas de dados.
          Path('scripts/test-dashboard-freshness.mjs').write_text(r'''import assert from 'node:assert/strict';
import fs from 'node:fs';
import { build } from './notion/build.mjs';

const control = ({ pe, date, status, title, typ = 'Estudo', meta = 0, attempted = 0, acertos = null }) => ({
  pe, date, status, title, typ, block: typ, meta, attempted, acertos,
  qg: 0, qe: 0, ag: null, ae: null, source: 'Teste', rd: '', redacao: false,
  review24: false, review72: false, efficiency: '', action: '', url: `https://example.test/${pe}`
});

const result = build([
  control({ pe: 'PE01', date: '2026-08-01', status: 'Concluído', title: 'Estudo', meta: 10, attempted: 10, acertos: 9 }),
  control({ pe: 'PE02', date: '2026-08-02', status: 'Descanso', title: 'Descanso / Anki leve', typ: 'Descanso' }),
  control({ pe: 'PE03', date: '2026-08-03', status: 'Não iniciada', title: 'Atividade de hoje', meta: 35 })
], [], [], '2026-08-03', '2026-08-03T14:00:00-03:00');

assert.equal(result.home.today.pe, 'PE03');
assert.equal(result.home.metrics.completed, 2, 'O descanso passado deve contar como ciclo cumprido.');
assert.equal(result.agenda.summary.remainingPE, 1);
assert.equal(result.audit.summary.rest_days, 1);
assert.deepEqual(JSON.parse(fs.readFileSync('data/live-v23.json', 'utf8')), {});
assert.deepEqual(JSON.parse(fs.readFileSync('data/live-v24.json', 'utf8')), {});

const common = fs.readFileSync('assets/common.js', 'utf8');
const loader = common.match(/export async function loadJSON[\s\S]*?export function fmtNumber/)?.[0] || '';
assert.ok(loader.includes('return r.json()'));
assert.ok(!loader.includes('patchValue'), 'loadJSON não pode aplicar overlays históricos.');
assert.ok(fs.readFileSync('assets/home.js', 'utf8').includes("metric('PE atual'"));

console.log('Atualidade do painel validada: PE do dia explícito, descansos contabilizados e overlays históricos desativados.');
''', encoding='utf-8')

          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          if 'node scripts/test-dashboard-freshness.mjs' not in data['scripts']['check']:
              data['scripts']['check'] = data['scripts']['check'].replace(
                  'node scripts/test-schedule-partition.mjs &&',
                  'node scripts/test-schedule-partition.mjs && node scripts/test-dashboard-freshness.mjs &&',
                  1
              )
          data['scripts']['test:freshness'] = 'node scripts/test-dashboard-freshness.mjs'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validar a plataforma integralmente
        run: npm run check

      - name: Consolidar a correção validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/notion-sync.yml assets/common.js assets/home.js data/live-v23.json data/live-v24.json package.json scripts/notion/build.mjs scripts/postprocess-v26.mjs scripts/validate-platform.mjs scripts/test-dashboard-freshness.mjs
          git commit -m 'Corrigir dia atual e remover sobreposições antigas'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
