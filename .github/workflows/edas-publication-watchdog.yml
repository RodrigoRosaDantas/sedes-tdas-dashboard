name: Monitorar publicação EDAS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'edas-administracao/**'
      - 'scripts/monitor-edas-publication.mjs'
      - 'scripts/monitor-edas-live-site.mjs'
      - 'scripts/test-edas-operations.mjs'
      - '.github/workflows/edas-publication-watchdog.yml'
      - '.github/workflows/edas-browser-smoke.yml'
      - 'package.json'
      - 'docs/OPERACAO_SITE_TDAS.md'
  push:
    branches: [main]
    paths:
      - 'edas-administracao/**'
      - 'scripts/monitor-edas-publication.mjs'
      - 'scripts/monitor-edas-live-site.mjs'
      - 'scripts/test-edas-operations.mjs'
      - '.github/workflows/edas-publication-watchdog.yml'
      - '.github/workflows/edas-browser-smoke.yml'
      - 'package.json'
      - 'docs/OPERACAO_SITE_TDAS.md'
  schedule:
    - cron: '45 4,10,16,22 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: edas-publication-watchdog
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar motores do EDAS no pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          npm run test:edas-operations
          npm run check:edas
          MONITOR_SELF_TEST=true npm run monitor:edas-live

      - name: Verificar publicação EDAS na main
        if: github.event_name != 'pull_request'
        id: publication
        continue-on-error: true
        env:
          TZ: America/Sao_Paulo
          REQUIRE_EDAS_FRESHNESS: 'true'
          EDAS_MAX_AGE_MINUTES: '420'
          EDAS_MONITOR_REPORT_PATH: /tmp/edas-publication-monitor.json
        run: npm run monitor:edas

      - name: Verificar EDAS implantado no GitHub Pages
        if: github.event_name != 'pull_request'
        id: live_site
        continue-on-error: true
        env:
          EDAS_SITE_BASE_URL: https://rodrigorosadantas.github.io/sedes-tdas-dashboard/edas-administracao
          EDAS_LIVE_MAX_ATTEMPTS: '12'
          EDAS_LIVE_RETRY_DELAY_MS: '15000'
          EDAS_LIVE_REPORT_PATH: /tmp/edas-live-monitor.json
        run: npm run monitor:edas-live

      - name: Manter incidente EDAS único
        if: github.event_name != 'pull_request' && always()
        uses: actions/github-script@v7
        env:
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
          LIVE_OUTCOME: ${{ steps.live_site.outcome }}
          PUBLICATION_REPORT: /tmp/edas-publication-monitor.json
          LIVE_REPORT: /tmp/edas-live-monitor.json
        with:
          script: |
            const fs=require('fs');
            const title='[Monitor] EDAS sem publicação atual';
            const read=(file,fallback)=>fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')):fallback;
            const publication=read(process.env.PUBLICATION_REPORT,{healthy:false,summary:'Relatório local EDAS ausente.',markdown:'## Monitoramento EDAS\n\nRelatório local ausente.'});
            const live=read(process.env.LIVE_REPORT,{healthy:false,summary:'Relatório do GitHub Pages EDAS ausente.',markdown:'## GitHub Pages EDAS\n\nRelatório público ausente.'});
            const healthy=process.env.PUBLICATION_OUTCOME==='success'&&process.env.LIVE_OUTCOME==='success'&&publication.healthy===true&&live.healthy===true;
            const runUrl=`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body=`${publication.markdown}\n\n---\n\n${live.markdown}\n\n[Consultar execução do monitor](${runUrl})`;
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'all',per_page:100});
            const existing=issues.filter(i=>!i.pull_request&&i.title===title).sort((a,b)=>b.number-a.number)[0];
            if(!healthy){
              if(existing)await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,title,body,state:'open'});
              else await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
              core.warning(`${publication.summary} ${live.summary}`);return;
            }
            if(existing?.state==='open'){
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body:`✅ Recuperação EDAS confirmada: main, GitHub Pages, catálogo, PWA e proteção de correção voltaram a ficar íntegros.\n\n[Consultar execução](${runUrl})`});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,state:'closed'});
            }
            core.info(`${publication.summary} ${live.summary}`);

      - name: Sinalizar inconsistência EDAS
        if: ${{ github.event_name != 'pull_request' && (steps.publication.outcome == 'failure' || steps.live_site.outcome == 'failure') }}
        run: exit 1
