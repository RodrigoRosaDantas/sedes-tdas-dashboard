name: Publicar mapa seguro do Notion

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Sincronizar Plataforma TDAS v28']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: notion-mirror-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar main atual
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gerar mapa seguro do Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TZ: America/Sao_Paulo
        run: node scripts/sync-notion-mirror.mjs

      - name: Validar escopo público seguro
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-notion-mirror-contract.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const index=JSON.parse(await fs.readFile('data/notion-mirror/index.json','utf8'));
          if(index.bootstrap) throw new Error('Mapa permaneceu em bootstrap.');
          if(index.publicScope!=='safe') throw new Error(`Escopo público inválido: ${index.publicScope}`);
          if(!Number.isInteger(index.pageCount)||index.pageCount<=1) throw new Error(`Quantidade de páginas inválida: ${index.pageCount}`);
          if(!Number.isInteger(index.protectedPageCount)||index.protectedPageCount<1) throw new Error('Nenhuma área protegida foi registrada.');
          if(index.recordCount!==0) throw new Error(`Linhas de banco não podem ser públicas: ${index.recordCount}`);
          if((index.databases||[]).some(db=>(db.shards||[]).length)) throw new Error('Banco com shard público detectado.');
          if(!index.hash||index.hash==='bootstrap'||index.hash==='quarantine') throw new Error('Hash real do mapa seguro não foi gerado.');
          console.log(`Mapa seguro validado: ${index.pageCount} páginas de navegação, ${index.protectedPageCount} áreas protegidas e ${index.databaseCount} bancos sem linhas públicas.`);
          NODE
          npm run check

      - name: Publicar snapshot seguro somente se houver mudança
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tdas-notion-mirror[bot]'
          git config user.email 'tdas-notion-mirror[bot]@users.noreply.github.com'
          git add -A data/notion-mirror
          if git diff --cached --quiet; then
            echo 'Mapa seguro já está atualizado; nenhuma publicação necessária.'
            exit 0
          fi
          git commit -m 'Atualizar mapa seguro do Notion'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
