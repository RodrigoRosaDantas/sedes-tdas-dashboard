name: Verificar importação real do conteúdo diário

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: daily-content-live-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar Notion e gerar conteúdo real
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SYNC_KIND: smoke_real
          TZ: America/Sao_Paulo
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOTION_TOKEN"
          node scripts/prepare-calendar-refresh.mjs
          node scripts/sync-notion.mjs
          node scripts/postprocess-v23.mjs
          node scripts/postprocess-v24.mjs
          node scripts/postprocess-v26.mjs
          REQUIRE_CURRENT_SNAPSHOT=true node scripts/validate-calendar-snapshot.mjs
          npm run check
      - name: Resumir conteúdo gerado sem expor respostas
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const catalog=JSON.parse(await fs.readFile('data/integration/question-catalog.json','utf8'));
          const material=JSON.parse(await fs.readFile('data/integration/daily-material.json','utf8'));
          const contract=JSON.parse(await fs.readFile('data/integration/daily-execution.json','utf8'));
          const key=JSON.parse(await fs.readFile(catalog.keyPath,'utf8'));
          const result={
            importacao:'ok',pe:catalog.peId,questoes:catalog.questionCount,
            materialHtml:material.html.length,respostasSeparadas:key.answers.length,
            materialPageId:contract.current.materialPageId,
            questionPageId:contract.current.questionPageId,
            correcaoNoCatalogo:'answers' in catalog||'gabarito' in catalog,
            correcaoNoPrecache:(await fs.readFile('sw.js','utf8')).includes('question-keys/')
          };
          console.log(JSON.stringify(result));
          NODE
