name: Validar Mentor TDAS no navegador

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'mentor/**'
      - 'revisar/**'
      - 'assets/mentor.js'
      - 'assets/mentor.css'
      - 'assets/integration/mentor-engine.js'
      - 'assets/integration/mentor-ux.js'
      - 'assets/integration/module-reviews.js'
      - 'assets/tdas-mobile-ux.js'
      - 'data/error-questions/**'
      - 'data/subjects.json'
      - 'data/evolution.json'
      - 'data/edital-status.json'
      - 'scripts/test-mentor.mjs'
      - 'scripts/notion/mentor-enrichment.mjs'
      - 'scripts/postprocess-v26.mjs'
      - 'package.json'
      - 'sw.js'
      - '.github/workflows/mentor-browser.yml'
  push:
    branches: [main]
    paths:
      - 'mentor/**'
      - 'revisar/**'
      - 'assets/mentor.js'
      - 'assets/mentor.css'
      - 'assets/integration/mentor-engine.js'
      - 'assets/integration/mentor-ux.js'
      - 'assets/integration/module-reviews.js'
      - 'data/error-questions/**'
      - 'data/subjects.json'
      - 'data/evolution.json'
      - 'data/edital-status.json'
      - 'scripts/test-mentor.mjs'
      - 'scripts/notion/mentor-enrichment.mjs'
      - 'scripts/postprocess-v26.mjs'
      - 'sw.js'
      - '.github/workflows/mentor-browser.yml'

permissions:
  contents: read

concurrency:
  group: mentor-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar metodologia do Mentor
        run: npm run test:mentor
      - name: Preparar site e expectativas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tdas-site/sedes-tdas-dashboard
          cp -a . /tmp/tdas-site/sedes-tdas-dashboard/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='/tmp/tdas-site/sedes-tdas-dashboard',read=file=>JSON.parse(fs.readFileSync(`${root}/${file}`,'utf8'));
          const index=read('data/error-questions/index.json'),errors=(index.parts||[]).flatMap(part=>read(`data/error-questions/${part.file}`));
          const {buildOfficialMentorAnalysis,normalizeText}=await import(`file://${root}/assets/integration/mentor-engine.js`);
          const analysis=buildOfficialMentorAnalysis({errors,subjects:read('data/subjects.json'),evolution:read('data/evolution.json'),edital:read('data/edital-status.json'),snapshotDate:read('data/subjects.json').meta?.snapshotDate,examDate:read('data/subjects.json').meta?.examDate});
          const critical=analysis.priorities.filter(i=>i.severity==='critical').length,high=analysis.priorities.filter(i=>i.severity==='high').length,immediate=critical+high,crase=analysis.priorities.filter(i=>normalizeText(`${i.materia} ${i.tema} ${i.subtema}`).includes('crase')).length;
          if(!analysis.priorities.length||!immediate)throw new Error('Mentor sem diagnóstico acionável.');
          fs.writeFileSync('/tmp/mentor-expected.env',`ERRORS=${errors.length}\nPRIORITIES=${analysis.priorities.length}\nCRITICAL=${critical}\nHIGH=${high}\nIMMEDIATE=${immediate}\nCRASE=${crase}\n`);
          NODE
          cd /tmp/tdas-site
          python3 -m http.server 4176 >/tmp/mentor-server.log 2>&1 & echo $! >/tmp/mentor-server.pid
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4176/sedes-tdas-dashboard/mentor/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Validar Mentor e revisão dirigida em Chrome
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/mentor-expected.env
          root='http://127.0.0.1:4176/sedes-tdas-dashboard/'
          chrome=(google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=20000 --dump-dom)
          "${chrome[@]}" "${root}mentor/" >/tmp/mentor.html 2>/tmp/mentor.stderr
          "${chrome[@]}" --window-size=390,844 "${root}mentor/" >/tmp/mentor-mobile.html 2>/tmp/mentor-mobile.stderr
          "${chrome[@]}" "${root}mentor/?severity=critical" >/tmp/mentor-critical.html 2>/tmp/mentor-critical.stderr
          "${chrome[@]}" "${root}mentor/?severity=" >/tmp/mentor-all.html 2>/tmp/mentor-all.stderr
          "${chrome[@]}" "${root}revisar/?mentor=crase&subject=Portugu%C3%AAs" >/tmp/mentor-review.html 2>/tmp/mentor-review.stderr
          grep -q 'Pontos fracos e fragilidades' /tmp/mentor.html
          grep -q 'Blocos de desempenho forte' /tmp/mentor.html
          grep -q 'Forças temáticas deste dispositivo' /tmp/mentor.html
          grep -q 'Revisão dirigida' /tmp/mentor.html
          grep -q "${IMMEDIATE} de ${PRIORITIES} tópicos" /tmp/mentor.html
          grep -q "${PRIORITIES} de ${PRIORITIES} tópicos" /tmp/mentor-all.html
          grep -q "${CRITICAL} de ${PRIORITIES} tópicos" /tmp/mentor-critical.html
          grep -q '>Mais</span>' /tmp/mentor-mobile.html
          grep -q 'Revisão dirigida pelo Mentor' /tmp/mentor-review.html
          grep -q 'Revisar crase' /tmp/mentor-review.html
          ! grep -Eqi 'Construindo seu diagnóstico|Não foi possível carregar esta página|Uncaught (TypeError|ReferenceError|SyntaxError)' /tmp/mentor.html /tmp/mentor-mobile.html /tmp/mentor-review.html /tmp/mentor*.stderr
          printf '{"mentorBrowser":"ok","errors":%s,"priorities":%s,"immediate":%s,"critical":%s,"high":%s,"directedReview":true,"mobile":true}\n' "$ERRORS" "$PRIORITIES" "$IMMEDIATE" "$CRITICAL" "$HIGH"
      - name: Diagnosticar falha
        if: failure()
        run: |
          cat /tmp/mentor-expected.env 2>/dev/null || true
          for file in /tmp/mentor*.html /tmp/mentor*.stderr; do [[ -f "$file" ]] || continue; echo "=== $file ==="; tail -80 "$file"; done
      - name: Encerrar servidor
        if: always()
        run: kill "$(cat /tmp/mentor-server.pid 2>/dev/null)" 2>/dev/null || true
