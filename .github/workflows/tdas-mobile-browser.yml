name: Validar UX mobile TDAS no navegador

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'mais/**'
      - 'configuracoes/**'
      - 'assets/dashboard-pro-2026.css'
      - 'assets/integration/home-dashboard-pro-2026.js'
      - 'assets/tdas-mobile-ux.js'
      - 'assets/tdas-mobile-ux.css'
      - 'assets/tdas-pro-modules.js'
      - 'assets/tdas-pro-modules.css'
      - 'assets/tdas-command-palette.js'
      - 'assets/tdas-command-palette.css'
      - 'assets/settings.js'
      - 'assets/more.js'
      - 'assets/enhance-v20.js'
      - 'assets/integration/study-ux.js'
      - 'scripts/preserve-v27-pwa.mjs'
      - 'scripts/test-tdas-mobile-browser.mjs'
      - 'scripts/test-home-mobile-layout.mjs'
      - 'scripts/test-home-tablet-layout.mjs'
      - 'scripts/test-home-v28-browser.mjs'
      - 'scripts/test-home-v28-responsive-audit.mjs'
      - 'scripts/test-tdas-mobile-ux.mjs'
      - 'scripts/test-command-palette.mjs'
      - 'scripts/test-command-palette-browser.mjs'
      - 'sw.js'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'mais/**'
      - 'configuracoes/**'
      - 'assets/dashboard-pro-2026.css'
      - 'assets/integration/home-dashboard-pro-2026.js'
      - 'assets/tdas-mobile-ux.js'
      - 'assets/tdas-mobile-ux.css'
      - 'assets/tdas-pro-modules.js'
      - 'assets/tdas-pro-modules.css'
      - 'assets/tdas-command-palette.js'
      - 'assets/tdas-command-palette.css'
      - 'assets/settings.js'
      - 'assets/more.js'
      - 'assets/enhance-v20.js'
      - 'assets/integration/study-ux.js'
      - 'scripts/preserve-v27-pwa.mjs'
      - 'scripts/test-tdas-mobile-browser.mjs'
      - 'scripts/test-home-mobile-layout.mjs'
      - 'scripts/test-home-tablet-layout.mjs'
      - 'scripts/test-home-v28-browser.mjs'
      - 'scripts/test-home-v28-responsive-audit.mjs'
      - 'scripts/test-tdas-mobile-ux.mjs'
      - 'scripts/test-command-palette.mjs'
      - 'scripts/test-command-palette-browser.mjs'
      - 'sw.js'
      - 'package.json'
  schedule:
    - cron: '5 10 * * *'

permissions:
  contents: read

concurrency:
  group: tdas-mobile-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar contrato da UX mobile
        run: npm run test:tdas-mobile-ux

      - name: Validar TDAS mobile no Chrome real
        env:
          CHROME_BIN: google-chrome
        run: npm run test:tdas-mobile-browser

      - name: Validar Home em 360, 390 e 430 px
        env:
          CHROME_BIN: google-chrome
        run: node scripts/test-home-mobile-layout.mjs

      - name: Validar Home em iPad e tablet
        env:
          CHROME_BIN: google-chrome
        run: node scripts/test-home-tablet-layout.mjs

      - name: Validar Home Reta Final v28
        env:
          CHROME_BIN: google-chrome
        run: node scripts/test-home-v28-browser.mjs

      - name: Auditar Home v28 em mobile, iPad e desktop
        env:
          CHROME_BIN: google-chrome
        run: node scripts/test-home-v28-responsive-audit.mjs

      - name: Validar Command Palette no Chrome real
        env:
          CHROME_BIN: google-chrome
        run: npm run test:command-palette-browser
