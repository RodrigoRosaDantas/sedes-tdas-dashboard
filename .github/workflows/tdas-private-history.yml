name: Validar persistência local TDAS
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/integration/**'
      - 'sincronizacao/**'
      - 'exportar-tentativa/**'
      - 'scripts/preserve-private-history-pwa.mjs'
      - 'scripts/test-local-only-persistence.mjs'
      - 'scripts/sync-platform-version.mjs'
      - 'data/integration/navigation.json'
      - 'sw.js'
      - '.github/workflows/tdas-private-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar contrato local-only
        run: node scripts/test-local-only-persistence.mjs
      - name: Validar rascunho da sessão ativa
        run: node scripts/test-session-draft.mjs
      - name: Validar PWA sem histórico pessoal
        run: |
          node scripts/preserve-private-history-pwa.mjs
          ! grep -E 'firebase-history|private-history-(auth|sync|runtime|materialize|login|page|config)' sw.js
      - name: Executar gate integral TDAS
        run: npm run check
