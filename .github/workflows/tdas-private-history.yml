name: Validar persistência privada TDAS
on:
  pull_request:
    paths:
      - 'assets/integration/**'
      - 'exportar-tentativa/**'
      - 'sincronizacao/**'
      - 'scripts/*history*.mjs'
      - 'scripts/*export*.mjs'
      - 'scripts/preserve-private-history-pwa.mjs'
      - 'scripts/preserve-v27-pwa.mjs'
      - 'scripts/validate-pwa-integration.mjs'
      - 'docs/PERSISTENCIA_LOCAL_ONLY_TDAS.md'
      - '.github/workflows/tdas-private-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe local-only
        run: |
          node --check assets/integration/module-store.js
          node --check assets/integration/persistence-local-v2.js
          node --check assets/integration/private-history-runtime-v3.js
          node --check assets/integration/private-history-sync-v3.js
          node --check assets/integration/local-only-result-policy.js
          node --check scripts/preserve-private-history-pwa.mjs
          node --check scripts/preserve-v27-pwa.mjs
          node --check scripts/validate-pwa-integration.mjs
      - name: Validar nuvem pessoal desativada
        run: |
          ! grep -E 'firebase-history-store|getPrivateSession|readFirebaseHistory|putFirebase' assets/integration/private-history-sync-v3.js
          ! grep -E 'archiveLocalState|getPrivateSession|setInterval' assets/integration/private-history-runtime-v3.js
          grep -F "mode:'local-only'" assets/integration/private-history-sync-v3.js
          grep -F "persistenceMode='local-only'" assets/integration/private-history-runtime-v3.js
          grep -F 'persisted:false' assets/integration/module-store.js
          ! grep -F 'setItem(STORAGE_KEY' assets/integration/module-store.js
          ! grep -F 'attempt-diagnostics.js' assets/integration/resolver-bootstrap.js
          grep -F 'local-only-result-policy.js' assets/integration/resolver-bootstrap.js
      - name: Validar rascunho local e legado preservado
        run: |
          node scripts/test-session-draft.mjs
          node scripts/test-cross-project-convergence.mjs
          grep -Fi 'dados pessoais legados' docs/PERSISTENCIA_LOCAL_ONLY_TDAS.md
          grep -Fi 'rascunho local' docs/PERSISTENCIA_LOCAL_ONLY_TDAS.md
      - name: Validar blindagem PWA local-only
        run: |
          node scripts/preserve-private-history-pwa.mjs
          node scripts/preserve-v27-pwa.mjs
          ! grep -E 'private-history|firebase-history|attempt-diagnostics' sw.js
          grep -F 'assets/integration/local-only-result-policy.js' sw.js
          node scripts/validate-pwa-integration.mjs
      - name: Executar gate integral TDAS
        run: npm run check
