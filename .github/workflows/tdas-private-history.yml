name: Validar persistência privada TDAS
on:
  push:
    branches:
      - 'fix/historico-tdas-sem-pe88-especial-20260813'
  pull_request:
    paths:
      - 'assets/integration/**'
      - 'data/integration/question-archive/**'
      - 'exportar-tentativa/**'
      - 'sincronizacao/**'
      - 'firestore.rules'
      - 'scripts/*history*.mjs'
      - 'scripts/*export*.mjs'
      - 'scripts/preserve-private-history-pwa.mjs'
      - '.github/workflows/tdas-private-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe da persistência
        run: |
          node --check assets/integration/attempt-export.js
          node --check assets/integration/attempt-history-v2.js
          node --check assets/integration/answer-history.js
          node --check assets/integration/answer-history-runtime-v2.js
          node --check assets/integration/error-book-export.js
          node --check assets/integration/error-book-enhancer-v2.js
          node --check assets/integration/firebase-history-store.js
          node --check assets/integration/history-db-core.js
          node --check assets/integration/persistence-contract.js
          node --check assets/integration/persistence-queue.js
          node --check assets/integration/persistence-local-v2.js
          node --check assets/integration/private-history-auth.js
          node --check assets/integration/private-history-page.js
          node --check assets/integration/private-history-materialize.js
          node --check assets/integration/private-history-runtime-v3.js
          node --check assets/integration/private-history-sync-v3.js
          node --check assets/integration/question-catalog-archive.js
          node --check assets/integration/result-persistence-links-v2.js
          node --check assets/integration/module-error-book-v3.js
          node --check assets/integration/module-performance-v6.js
      - name: Validar contrato Firebase
        run: |
          grep -F "provider:'firebase'" assets/integration/private-history-config.js
          grep -F "request.auth.uid == userId" firestore.rules
          grep -F "'users',String(userId),'attempts'" assets/integration/firebase-history-store.js
          grep -F "writeBatch" assets/integration/firebase-history-store.js
      - name: Validar semântica da central de histórico
        run: |
          grep -F 'Histórico pessoal TDAS' assets/integration/private-history-page.js
          grep -F 'PEs já concluídos são tratados somente como histórico de resolução' assets/integration/private-history-page.js
          grep -F "private-history-sync-v3.js?v=3.0.0" assets/integration/private-history-page.js
          ! grep -F 'PE88 localizado neste navegador' assets/integration/private-history-page.js
          ! grep -F 'Migração local pronta' assets/integration/private-history-page.js
          ! grep -Fi 'Supabase' assets/integration/private-history-page.js
      - name: Testar sequência de respostas
        run: node scripts/test-answer-sequence.mjs
      - name: Testar contrato JSON
        run: node scripts/test-attempt-export-contract.mjs
      - name: Testar catálogo histórico
        run: node scripts/test-history-archive.mjs
      - name: Testar blindagem PWA privada
        run: |
          node scripts/preserve-private-history-pwa.mjs
          grep -F 'assets/integration/private-history-sync-v3.js' sw.js
          grep -F 'assets/integration/private-history-page.js' sw.js
          grep -F 'data/integration/question-archive/tdas-pe88-339d718d88c1.json' sw.js
          grep -F 'exportar-tentativa/' sw.js
      - name: Executar gate integral TDAS
        run: npm run check
