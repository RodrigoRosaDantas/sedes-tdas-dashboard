name: Sincronizar EDAS S12
on:
  pull_request:
    branches: [main]
    paths: [edas-sync-s12.ready]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Aplicar pacote oficial S12
        shell: bash
        run: |
          set -euo pipefail
          cat edas-sync-s12.parts/part*.b64 > /tmp/p.b64
          base64 --decode /tmp/p.b64 > /tmp/p.tar.gz
          test "$(sha256sum /tmp/p.tar.gz | awk '{print $1}')" = "038679964fc48dd13161556bdd48e0c437be64b5b2c3038117f48e119e57e358"
          rm -rf /tmp/edas-s12 && mkdir -p /tmp/edas-s12
          tar -xzf /tmp/p.tar.gz -C /tmp/edas-s12 --touch --no-same-owner --no-same-permissions --no-overwrite-dir
          cp /tmp/edas-s12/data/site.json edas-administracao/data/site.json
          cp /tmp/edas-s12/data/sync-history.json edas-administracao/data/sync-history.json
          cp /tmp/edas-s12/data/integration/daily-material.json edas-administracao/data/integration/daily-material.json
          cp /tmp/edas-s12/data/integration/question-catalog.json edas-administracao/data/integration/question-catalog.json
          cp /tmp/edas-s12/data/integration/answer-key.json edas-administracao/data/integration/answer-key.json
          cp /tmp/edas-s12/data/integration/daily-contract.json edas-administracao/data/integration/daily-contract.json
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('edas-administracao')
          for p in root.rglob('*'):
              if p.is_file() and p.suffix in {'.html','.js','.webmanifest'}:
                  p.write_text(p.read_text(encoding='utf-8').replace('20260805.3','20260807.1'),encoding='utf-8')
          p=root/'assets/integration/module-player.js'; t=p.read_text(encoding='utf-8')
          t=t.replace("if(!question.enunciado||!question.alternativas||!question.gabarito)throw new Error(`Questão ${index+1} incompleta.`)","if(!question.enunciado||!question.alternativas)throw new Error(`Questão ${index+1} incompleta.`)")
          marker="const letters=alternatives=>Array.isArray(alternatives)?alternatives.map((text,index)=>[String.fromCharCode(65+index),text]):Object.entries(alternatives||{});\n"
          helper="const readAnswerKey=async catalog=>{if((catalog.questions||[]).every(q=>q.gabarito))return Object.fromEntries(catalog.questions.map(q=>[q.id,{gabarito:q.gabarito,justificativa:q.justificativa||''}]));const r=await fetch('../data/integration/answer-key.json?v=20260807.1',{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar correção ('+r.status+')');const d=await r.json();if(d?.catalogId!==catalog.catalogId||!d?.answers)throw new Error('Correção incompatível com o catálogo atual.');return d.answers};\n"
          if 'const readAnswerKey=' not in t:
              if marker not in t: raise SystemExit('marker player ausente')
              t=t.replace(marker,marker+helper)
          pat=re.compile(r" const finish=\(\)=>\{.*?\};\n render\(\);",re.S)
          rep=""" const finish=async()=>{try{const key=await readAnswerKey(catalog),finishedAt=now(),results=questions.map(question=>{const c=question.gabarito?{gabarito:question.gabarito,justificativa:question.justificativa||''}:key[question.id];if(!c?.gabarito)throw new Error(`Gabarito ausente: ${question.id}`);const selected=answers[question.id],correctAnswer=String(c.gabarito).trim().toUpperCase();return{id:question.id,selected,correctAnswer,correct:selected===correctAnswer,justificativa:c.justificativa||''}}),correct=results.filter(x=>x.correct).length,evaluation={session:{startedAt,finishedAt},elapsedMs:finishedAt-startedAt,correct,incorrect:results.length-correct,total:results.length,percent:results.length?correct/results.length*100:0,results};saveCompletedAttempt({catalog:{...catalog,questions},evaluation,responseMeta:meta,mode:review?'review':'study',reviewId:review?.id||null});main.innerHTML=`<section class=\"hero\"><span class=\"kicker\">Sessão concluída</span><h1>${correct}/${results.length} · ${evaluation.percent.toFixed(1).replace('.',',')}%</h1><p>O resultado foi salvo somente neste aparelho. Revisões foram agendadas para itens elegíveis.</p><div class=\"hero-actions\"><a class=\"btn primary\" href=\"${routes.desempenho}\">Ver desempenho</a><a class=\"btn\" href=\"${routes.revisar}\">Abrir revisões</a><a class=\"btn\" href=\"${routes.caderno}\">Abrir caderno</a></div></section><section class=\"section\"><div class=\"result-list\">${results.map(result=>{const question=questions.find(item=>item.id===result.id);return`<article class=\"result-item ${result.correct?'correct':'incorrect'}\"><b>${escapeHTML(question?.numero_original||question?.id)} · ${result.correct?'Correta':'Incorreta'}</b><p>Marcada: ${escapeHTML(result.selected)} · Gabarito: ${escapeHTML(result.correctAnswer)}</p>${result.justificativa?`<small>${escapeHTML(result.justificativa)}</small>`:''}</article>`}).join('')}</div></section>`}catch(e){alert(e.message)}};\n render();"""
          t,n=pat.subn(rep,t,count=1)
          if n!=1: raise SystemExit('finish player ausente')
          p.write_text(t,encoding='utf-8')
          p=root/'sw.js'; t=p.read_text(encoding='utf-8')
          t=t.replace("BASE+'data/integration/question-catalog.json',BASE+'data/integration/daily-material.json'","BASE+'data/integration/question-catalog.json',BASE+'data/integration/answer-key.json',BASE+'data/integration/daily-material.json'")
          old=" if(url.pathname===BASE+'data/site.json'){event.respondWith((async()=>{try{const fresh=await fetch(event.request,{cache:'no-store'});const cache=await caches.open(VERSION);cache.put(BASE+'data/site.json',fresh.clone());return fresh}catch{return(await caches.match(event.request))||(await caches.match(BASE+'data/site.json'))}})());return}"
          new=" if(url.pathname.startsWith(BASE+'data/')){event.respondWith((async()=>{try{const fresh=await fetch(event.request,{cache:'no-store'});const cache=await caches.open(VERSION);cache.put(event.request,fresh.clone());return fresh}catch{return(await caches.match(event.request,{ignoreSearch:true}))||Response.error()}})());return}"
          if old not in t: raise SystemExit('cache block ausente')
          p.write_text(t.replace(old,new),encoding='utf-8')
          PY
      - name: Validar integralmente
        shell: bash
        run: |
          set -euo pipefail
          for f in edas-administracao/assets/*.js edas-administracao/assets/integration/*.js edas-administracao/sw.js; do node --check "$f"; done
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('edas-administracao')
          s=json.loads((r/'data/site.json').read_text()); assert len(s['sprints'])==42; assert s['today']['sprint']=='S12'; assert s['meta']['snapshotDate']=='2026-08-07'; assert len(s['cases'])==12; assert s['metrics']=={'completed':3,'total':42,'questions':115,'correct':94,'accuracy':81.74,'errors':21,'casesCompleted':0,'casesTotal':12}
          c=json.loads((r/'data/integration/question-catalog.json').read_text()); assert c['status']=='ready' and c['sprintId']=='S12' and len(c['questions'])==45; assert all('gabarito' not in q and 'justificativa' not in q for q in c['questions'])
          k=json.loads((r/'data/integration/answer-key.json').read_text()); assert k['catalogId']==c['catalogId'] and len(k['answers'])==45
          m=json.loads((r/'data/integration/daily-material.json').read_text()); assert m['status']=='ready' and m['sprintId']=='S12' and m['html']
          h=json.loads((r/'data/sync-history.json').read_text()); assert len(h['events'])<=40
          d=json.loads((r/'data/integration/daily-contract.json').read_text()); assert d['paths']['answerKey']=='data/integration/answer-key.json'
          manifest=json.loads((r/'manifest.webmanifest').read_text()); assert '20260807.1' in manifest['start_url']
          idx=(r/'index.html').read_text(); assert 'home.js?v=20260807.1' in idx and 'home-command-center.js?v=20260807.1' in idx and 'assets/app.js' not in idx
          store=(r/'assets/integration/module-store.js').read_text(); assert 'edas.400.question-module.v2.state' in store and 'tdas.202.question-module' not in store
          player=(r/'assets/integration/module-player.js').read_text(); assert 'readAnswerKey' in player
          sw=(r/'sw.js').read_text(); assert 'answer-key.json' in sw and "url.pathname.startsWith(BASE+'data/')" in sw
          for x in ['hoje','evolucao','riscos','agenda','estudos-caso','auditoria','mais','estudar','resolver','revisar','caderno-erros','desempenho','fila-ia','sprints','sprint','materias','materia','historico']:
              assert (r/x/'index.html').is_file(), x
          stale=[]
          for p in r.rglob('*'):
              if p.is_file() and p.suffix in {'.html','.js','.webmanifest'} and '20260805.3' in p.read_text(encoding='utf-8'):
                  stale.append(str(p))
          assert not stale, stale
          PY
      - name: Enviar arquivos funcionais
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EDAS Platform Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add edas-administracao
          git rm -r --ignore-unmatch edas-sync-s12.parts edas-sync-s12.ready
          git commit -m 'Sincronizar EDAS para S12 e publicar bateria oficial'
          git push origin HEAD:${{ github.head_ref }}
