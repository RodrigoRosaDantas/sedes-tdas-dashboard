name: Validar experiência pública no navegador

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'mais/**'
      - 'auditoria/**'
      - 'resolver/**'
      - 'revisar/**'
      - 'redacoes/**'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'sw.js'
      - '.github/workflows/browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'mais/**'
      - 'auditoria/**'
      - 'resolver/**'
      - 'revisar/**'
      - 'redacoes/**'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'sw.js'
      - '.github/workflows/browser-smoke.yml'
  schedule:
    - cron: '15 9 * * *'

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar gate estrutural
        run: npm run check
      - name: Preparar site e estados locais legados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tdas-site/sedes-tdas-dashboard
          cp -a . /tmp/tdas-site/sedes-tdas-dashboard/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='/tmp/tdas-site/sedes-tdas-dashboard';
          const dailyCatalog=JSON.parse(fs.readFileSync(`${root}/data/integration/question-catalog.json`,'utf8'));
          const audit=JSON.parse(fs.readFileSync(`${root}/data/audit.json`,'utf8'));
          const platform=JSON.parse(fs.readFileSync(`${root}/data/platform-version.json`,'utf8'));
          let catalog=dailyCatalog;
          if((dailyCatalog.questions||[]).length<3){
            const archiveIndex=JSON.parse(fs.readFileSync(`${root}/data/integration/question-archive/index.json`,'utf8'));
            for(const entry of Object.values(archiveIndex.catalogs||{}).reverse()){
              if(!entry?.path)continue;
              const candidate=JSON.parse(fs.readFileSync(`${root}/${entry.path}`,'utf8'));
              if((candidate.questions||[]).length>=3){catalog=candidate;break}
            }
          }
          const ids=(catalog.questions||[]).map(item=>item.id);
          if(ids.length<3)throw new Error('Smoke exige catálogo histórico com ao menos três questões.');
          const draft={schemaVersion:'1.0.0',catalogId:catalog.catalogId,peId:catalog.peId,savedAt:Date.now(),session:{schemaVersion:'1.0.0',materialId:catalog.catalogId,questionIds:ids,answers:{[ids[0]]:'A',[ids[1]]:'B'},currentIndex:2,startedAt:Date.now()-120000,updatedAt:Date.now(),finishedAt:null},responseMeta:{}};
          const question=catalog.questions[0],reviewId=`review:smoke:${catalog.catalogId}:${question.id}:D+1`;
          const review={id:reviewId,sourceAttemptId:'attempt:smoke',questionId:question.id,peId:catalog.peId,stage:'D+1',dueAt:Date.now()-60000,status:'pending',completedAt:null,reviewAttemptId:null,outcome:null,originReviewId:null,rootReviewId:reviewId,recurrenceCount:1,sourceOutcome:'wrong_again',classification:'incorrect_confirmed',confidence:'secure'};
          const moduleState={schemaVersion:'2.0.0',updatedAt:Date.now(),attempts:[],errors:[],marked:[],reviews:[review],aiQueue:[]};
          const unlinked=(audit.quality||[]).filter(item=>item.title==='Registro incompleto no Caderno de Erros'&&/Origem \/ Dia ID/.test(item.detail||'')).length;
          fs.writeFileSync(`${root}/__seed.html`,`<!doctype html><meta charset="utf-8"><script>localStorage.setItem('tdas.202.question-module.v2.draft',${JSON.stringify(JSON.stringify(draft))});location.replace('/sedes-tdas-dashboard/');<\/script>`);
          fs.writeFileSync(`${root}/__review.html`,`<!doctype html><meta charset="utf-8"><script>localStorage.setItem('tdas.202.question-module.v2.state',${JSON.stringify(JSON.stringify(moduleState))});location.replace('/sedes-tdas-dashboard/resolver/?review='+encodeURIComponent(${JSON.stringify(reviewId)}));<\/script>`);
          fs.writeFileSync('/tmp/tdas-expected.env',`PLATFORM_VERSION=${platform.platformVersion}\nUNLINKED_ERRORS=${unlinked}\nCURRENT_PE=${dailyCatalog.peId||'PE112'}\n`);
          NODE
          cd /tmp/tdas-site
          python3 -m http.server 4173 >/tmp/tdas-server.log 2>&1 &
          echo $! >/tmp/tdas-server.pid
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/sedes-tdas-dashboard/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/tdas-server.log >&2
          exit 1
      - name: Validar Home v3, Arquivo e recursos preservados
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/tdas-expected.env
          base='http://127.0.0.1:4173/sedes-tdas-dashboard'
          chrome=(google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom)
          "${chrome[@]}" "$base/" >/tmp/home.html 2>/tmp/home.stderr
          "${chrome[@]}" --user-data-dir=/tmp/tdas-profile "$base/__seed.html" >/tmp/resume.html 2>/tmp/resume.stderr
          "${chrome[@]}" --user-data-dir=/tmp/tdas-review-profile "$base/__review.html" >/tmp/review.html 2>/tmp/review.stderr
          "${chrome[@]}" "$base/mais/" >/tmp/archive.html 2>/tmp/archive.stderr
          "${chrome[@]}" "$base/auditoria/" >/tmp/audit.html 2>/tmp/audit.stderr
          "${chrome[@]}" "$base/resolver/" >/tmp/resolver.html 2>/tmp/resolver.stderr

          grep -q 'data-post-exam-home="3"' /tmp/home.html
          grep -q 'Pós-prova, sem ruído.' /tmp/home.html
          grep -q 'Gabarito preliminar' /tmp/home.html
          grep -q 'ANDAMENTO DO CONCURSO' /tmp/home.html
          grep -q 'RESUMO FINAL' /tmp/home.html
          grep -q 'Abrir arquivo do ciclo' /tmp/home.html
          grep -q 'Atualizar dados' /tmp/home.html
          grep -q "v${PLATFORM_VERSION}" /tmp/home.html
          ! grep -Eqi 'ORIENTAÇÃO DE HOJE|Reta final|FOTOGRAFIA FINAL|ARQUIVO DO CICLO|O ciclo terminou\. Agora é acompanhar o concurso\.|data-primary-stage=' /tmp/home.html
          ! grep -q 'Continuar questão' /tmp/resume.html
          grep -q 'Abrir arquivo do ciclo' /tmp/resume.html

          grep -q 'Arquivo do ciclo' /tmp/archive.html
          grep -q 'Preparação arquivada' /tmp/archive.html
          grep -q 'Questões' /tmp/archive.html
          grep -q 'Check do Edital' /tmp/archive.html
          grep -q 'Redações' /tmp/archive.html
          grep -q 'Fila de IA' /tmp/archive.html

          grep -q 'Prioridades para revisar' /tmp/review.html
          grep -q 'O TDAS não executa mais a revisão' /tmp/review.html
          grep -q 'data-review-mode="priorities-only"' /tmp/review.html
          ! grep -Eqi 'Iniciar revisão|Revisar questão|resolver/\?review=' /tmp/review.html

          grep -q 'Erros sem origem confirmada' /tmp/audit.html
          grep -q "${UNLINKED_ERRORS} pendentes" /tmp/audit.html
          grep -q 'Banco de questões' /tmp/resolver.html
          ! grep -Eqi 'Carregando pós-prova|Não foi possível carregar o pós-prova|Não foi possível carregar esta página' /tmp/home.html
          ! grep -Eqi 'Uncaught (TypeError|ReferenceError|SyntaxError)' /tmp/*.stderr
          ! grep -q 'assets/integration/review-engine.js' /tmp/tdas-site/sedes-tdas-dashboard/sw.js
          ! grep -Eqi 'private-history|result-persistence-links|firebase-history' /tmp/tdas-site/sedes-tdas-dashboard/sw.js
          ! grep -q 'question-keys/' /tmp/tdas-site/sedes-tdas-dashboard/sw.js
          printf '{"browser":"ok","postExamV3":true,"mainAreas":3,"archive":true,"priorityHandoff":true,"internalReview":false,"platformVersion":"%s","unlinkedErrors":%s,"answerKeyPrecached":false}\n' "$PLATFORM_VERSION" "$UNLINKED_ERRORS"
      - name: Diagnosticar falha do navegador
        if: failure()
        shell: bash
        run: |
          for file in /tmp/home.html /tmp/resume.html /tmp/review.html /tmp/archive.html /tmp/audit.html /tmp/resolver.html; do
            [[ -f "$file" ]] || continue
            echo "=== $file ==="
            grep -Eo 'Pós-prova, sem ruído\.|Gabarito preliminar|ANDAMENTO DO CONCURSO|RESUMO FINAL|Arquivo do ciclo|Preparação arquivada|Prioridades para revisar|Banco de questões|[0-9]+ pendentes|Não foi possível carregar[^<]+' "$file" | head -80 || true
          done
      - name: Encerrar servidor
        if: always()
        run: kill "$(cat /tmp/tdas-server.pid 2>/dev/null)" 2>/dev/null || true
