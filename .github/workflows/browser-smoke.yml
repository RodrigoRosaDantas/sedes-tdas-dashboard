name: Aplicar suporte ao gabarito compacto

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/patch-compact-answer-key.mjs'
      - '.github/workflows/browser-smoke.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/padronizar-versao-publicacao'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch do PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar e testar
        run: |
          set -euo pipefail
          node scripts/patch-compact-answer-key.mjs
          npm run test:daily-content
      - name: Registrar correção
        run: |
          set -euo pipefail
          git config user.name 'tdas-compact-key-fix[bot]'
          git config user.email 'tdas-compact-key-fix[bot]@users.noreply.github.com'
          git add scripts/notion/daily-content.mjs scripts/test-daily-content.mjs
          git commit -m 'Reconhecer gabarito compacto do PE79'
          git push origin HEAD:${{ github.head_ref }}
