name: Validar experiência pública no navegador

on:
  push:
    branches:
      - agent/simplificar-revisoes-chatgpt-notion
    paths:
      - '.tdas-handoff/**'
      - '.github/workflows/browser-smoke.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-tdas-handoff-bundle
  cancel-in-progress: false

jobs:
  apply-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar branch de implementação
        uses: actions/checkout@v4
        with:
          ref: agent/simplificar-revisoes-chatgpt-notion
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruir bundle validado
        shell: bash
        run: |
          set -euo pipefail
          cat .tdas-handoff/part-*.b64 > /tmp/tdas-handoff.tar.gz.b64
          base64 -d /tmp/tdas-handoff.tar.gz.b64 > /tmp/tdas-handoff.tar.gz
          echo '57a0af02c25be45c829dd28bd1e9cf8481c7cc642b316e90f4dafbf1b16a7aab  /tmp/tdas-handoff.tar.gz' | sha256sum -c -
          tar -xzf /tmp/tdas-handoff.tar.gz

      - name: Validar arquitetura simplificada
        run: npm test

      - name: Publicar alteração validada na branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tdas-handoff
          rm -f .github/workflows/apply-tdas-handoff-bundle.yml
          git config user.name 'tdas-refactor[bot]'
          git config user.email 'tdas-refactor[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Simplificar TDAS para execução → ChatGPT → Notion [handoff-bundle-applied]'
          git push origin HEAD:agent/simplificar-revisoes-chatgpt-notion
