name: Aplicar refatoração auditada TDAS

on:
  pull_request:
    branches: [main]
    paths:
      - '.tdas-audit/**'
      - '.tdas-delta/**'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tdas-refatoracao-auditada-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/tdas-execucao-chatgpt-notion-auditada' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar branch auditada
        uses: actions/checkout@v4
        with:
          ref: agent/tdas-execucao-chatgpt-notion-auditada
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar e recuperar refatoração funcional original
        shell: bash
        run: |
          set -euo pipefail
          ref='refs/remotes/origin/agent/simplificar-revisoes-chatgpt-notion'
          : > /tmp/tdas-refactor.b64
          for n in $(seq -w 0 10); do
            git show "${ref}:.tdas-handoff/part-${n}.b64" >> /tmp/tdas-refactor.b64
          done
          base64 -d /tmp/tdas-refactor.b64 > /tmp/tdas-refactor.tar.gz
          tar -tzf /tmp/tdas-refactor.tar.gz | sort > /tmp/archive-files.txt
          awk '{print $2}' .tdas-delta/original-files.sha256 | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/archive-files.txt
          rm -rf /tmp/tdas-refactor-verify
          mkdir -p /tmp/tdas-refactor-verify
          tar -xzf /tmp/tdas-refactor.tar.gz -C /tmp/tdas-refactor-verify
          (cd /tmp/tdas-refactor-verify && sha256sum -c "$GITHUB_WORKSPACE/.tdas-delta/original-files.sha256")
          echo 'Manifesto do pacote original: 104e7d81fcb4273e3c4268dbb19d1cd400211a3e8061afa8abdc8ae554e046a9'
          tar -xzf /tmp/tdas-refactor.tar.gz

      - name: Aplicar correções encontradas na auditoria
        shell: bash
        run: |
          set -euo pipefail
          cat .tdas-delta/part-*.b64 > /tmp/tdas-audit-delta.b64
          base64 -d /tmp/tdas-audit-delta.b64 > /tmp/tdas-audit-delta.patch.gz
          echo 'd34a3f59e1945e442504a76ea6a2faae1ce0f1bb1e01a8e4b35cb255d4d412ab  /tmp/tdas-audit-delta.patch.gz' | sha256sum -c -
          gzip -dc /tmp/tdas-audit-delta.patch.gz > /tmp/tdas-audit-delta.patch
          git apply --check /tmp/tdas-audit-delta.patch
          git apply /tmp/tdas-audit-delta.patch

      - name: Validar arquitetura completa
        shell: bash
        run: |
          set -euo pipefail
          npm test
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            node --check "$file"
          done < <(git diff --name-only -- '*.js' '*.mjs')
          grep -q 'Levar resultado ao ChatGPT' assets/integration/question-bank-player.js
          grep -q 'Confirmar que o ChatGPT atualizou o Notion' assets/integration/attempt-export-page-v2.js
          grep -q 'Foco trazido pelo Mentor' revisar/index.html
          grep -q 'pro8' sw.js
          ! grep -Eq 'D\+1.*D\+7.*D\+20' assets/integration/module-store.js

      - name: Materializar somente código funcional
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tdas-audit .tdas-delta
          git config user.name 'tdas-audit[bot]'
          git config user.email 'tdas-audit[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -Eq '^\.tdas-(audit|delta)/'; then
            echo 'Arquivos temporários ainda presentes no commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'TDAS: execução → ChatGPT → Notion (auditado)'
          git push origin HEAD:agent/tdas-execucao-chatgpt-notion-auditada
