name: Aplicar shell unificado TDAS

on:
  pull_request:
    branches: [main]
    paths:
      - '.tdas-shell/**'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch limpa
        uses: actions/checkout@v4
        with:
          ref: agent/tdas-shell-unificado-20260817
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruir conjunto auditado
        run: |
          set -euo pipefail
          cat .tdas-shell/chunk-00.b64 .tdas-shell/chunk-01.b64 .tdas-shell/chunk-02.b64 .tdas-shell/chunk-03.b64 .tdas-shell/chunk-04-rest.b64 > /tmp/tdas-shell.b64
          base64 -d /tmp/tdas-shell.b64 > /tmp/tdas-shell.tar.gz
          echo '82bbf4ae524f0cf77887cdf393cbb6de921d3a3e455eb52c1fd58bb1c8689b01  /tmp/tdas-shell.tar.gz' | sha256sum -c -
          test "$(tar -tzf /tmp/tdas-shell.tar.gz | wc -l)" -eq 51
          tar -xzf /tmp/tdas-shell.tar.gz

      - name: Validar arquitetura completa
        run: |
          set -euo pipefail
          npm test
          while IFS= read -r file; do
            node --check "$file"
          done < <(find assets scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)

      - name: Materializar somente código funcional
        run: |
          set -euo pipefail
          rm -rf .tdas-shell
          git config user.name 'tdas-ui-audit[bot]'
          git config user.email 'tdas-ui-audit[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Unificar shell TDAS e alinhar execução → ChatGPT → Notion'
          git push origin HEAD:agent/tdas-shell-unificado-20260817
