name: Validar experiência pública no navegador

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'auditoria/**'
      - 'resolver/**'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'sw.js'
      - '.github/workflows/browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'auditoria/**'
      - 'resolver/**'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'sw.js'
      - '.github/workflows/browser-smoke.yml'
  schedule:
    - cron: '15 9 * * *'

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Executar gate estrutural
        run: npm run check

      - name: Preparar site e sessão interrompida
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tdas-site/sedes-tdas-dashboard
          cp -a . /tmp/tdas-site/sedes-tdas-dashboard/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='/tmp/tdas-site/sedes-tdas-dashboard';
          const catalog=JSON.parse(fs.readFileSync(`${root}/data/integration/question-catalog.json`,'utf8'));
          const ids=catalog.questions.map(item=>item.id);
          const draft={schemaVersion:'1.0.0',catalogId:catalog.catalogId,peId:catalog.peId,savedAt:Date.now(),session:{schemaVersion:'1.0.0',materialId:catalog.catalogId,questionIds:ids,answers:{[ids[0]]:'A',[ids[1]]:'B'},currentIndex:2,startedAt:Date.now()-120000,updatedAt:Date.now(),finishedAt:null},responseMeta:{}};
          const progress={version:1,items:{[catalog.peId]:{material:true,questions:false,registered:false,updatedAt:new Date().toISOString()}}};
          const html=`<!doctype html><meta charset="utf-8"><script>localStorage.setItem('tdas.202.question-module.v2.draft',${JSON.stringify(JSON.stringify(draft))});localStorage.setItem('tdas.202.daily-execution.v1',${JSON.stringify(JSON.stringify(progress))});location.replace('/sedes-tdas-dashboard/');<\/script>`;
          fs.writeFileSync(`${root}/__seed.html`,html);
          NODE
          cd /tmp/tdas-site
          python3 -m http.server 4173 >/tmp/tdas-server.log 2>&1 &
          echo $! >/tmp/tdas-server.pid
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/sedes-tdas-dashboard/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/tdas-server.log >&2
          exit 1

      - name: Validar central, retomada e auditoria
        shell: bash
        run: |
          set -euo pipefail
          base='http://127.0.0.1:4173/sedes-tdas-dashboard'
          chrome=(google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom)
          "${chrome[@]}" "$base/" >/tmp/home.html 2>/tmp/home.stderr
          "${chrome[@]}" --user-data-dir=/tmp/tdas-profile "$base/__seed.html" >/tmp/resume.html 2>/tmp/resume.stderr
          "${chrome[@]}" "$base/auditoria/" >/tmp/audit.html 2>/tmp/audit.stderr
          "${chrome[@]}" "$base/resolver/" >/tmp/resolver.html 2>/tmp/resolver.stderr
          grep -q 'Central de execução' /tmp/home.html
          grep -q 'Continuar questão 3 de 48' /tmp/resume.html
          grep -q 'Erros sem origem confirmada' /tmp/audit.html
          grep -q '12 pendentes' /tmp/audit.html
          grep -q 'Questões do dia' /tmp/resolver.html
          ! grep -Eqi 'Carregando|Não foi possível carregar esta página' /tmp/home.html
          ! grep -Eqi 'Uncaught (TypeError|ReferenceError|SyntaxError)|Central de execução indisponível|Erros sem origem indisponíveis' /tmp/*.stderr
          ! grep -q 'question-keys/' /tmp/tdas-site/sedes-tdas-dashboard/sw.js
          echo '{"browser":"ok","commandCenter":true,"resume":"question-3-of-48","unlinkedErrors":12,"answerKeyPrecached":false}'

      - name: Encerrar servidor
        if: always()
        run: kill "$(cat /tmp/tdas-server.pid 2>/dev/null)" 2>/dev/null || true
