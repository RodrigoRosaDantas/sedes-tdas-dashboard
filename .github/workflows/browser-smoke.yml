name: Aplicar refatoração auditada TDAS

on:
  pull_request:
    branches: [main]
    paths:
      - '.tdas-audit/**'
      - '.tdas-delta/**'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tdas-refatoracao-auditada-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/tdas-execucao-chatgpt-notion-auditada' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar branch auditada
        uses: actions/checkout@v4
        with:
          ref: agent/tdas-execucao-chatgpt-notion-auditada
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruir pacote final auditado
        shell: bash
        run: |
          set -euo pipefail
          cat .tdas-audit/part-*.b64 > /tmp/tdas-final-audit.b64
          base64 -d /tmp/tdas-final-audit.b64 > /tmp/tdas-final-audit.tar.gz
          echo '70fd4ded4853bd1ef797ee88d4a2ec453b9a3fea37500d526c85b7d0887f1759  /tmp/tdas-final-audit.tar.gz' | sha256sum -c -
          tar -tzf /tmp/tdas-final-audit.tar.gz | sort > /tmp/archive-files.txt
          cat > /tmp/expected-files.txt <<'FILES'
          .github/workflows/browser-smoke.yml
          .github/workflows/mentor-browser.yml
          assets/home-mobile.js
          assets/integration/attempt-diagnostics.js
          assets/integration/attempt-export-page-v2.js
          assets/integration/attempt-export.js
          assets/integration/continuity-engine.js
          assets/integration/daily-priorities.js
          assets/integration/daily-progress.js
          assets/integration/error-book-export.js
          assets/integration/error-book.js
          assets/integration/home-command-center.js
          assets/integration/home-study-intelligence.js
          assets/integration/home-v28.js
          assets/integration/local-backup.js
          assets/integration/mentor-ux.js
          assets/integration/module-error-book-base.js
          assets/integration/module-performance-v4.js
          assets/integration/module-player.js
          assets/integration/module-store.js
          assets/integration/question-bank-player.js
          assets/integration/resolver-bootstrap.js
          assets/integration/result-persistence-links-v2.js
          assets/integration/study-analytics.js
          assets/integration/study-state.js
          assets/integration/study-ux.js
          assets/integration/today-execution.js
          assets/mentor.js
          assets/more.js
          assets/tdas-command-palette.js
          assets/tdas-mobile-ux.js
          assets/tdas-pro-modules.js
          data/platform-version.json
          manifest.webmanifest
          revisar/index.html
          scripts/sync-platform-version.mjs
          scripts/test-command-center.mjs
          scripts/test-command-palette.mjs
          scripts/test-daily-priorities.mjs
          scripts/test-mentor.mjs
          scripts/test-question-module.mjs
          scripts/test-tdas-mobile-browser.mjs
          scripts/test-tdas-mobile-ux.mjs
          scripts/test-v27-continuity.mjs
          scripts/test-v27-contract.mjs
          scripts/validate-daily-execution.mjs
          scripts/validate-daily-progress.mjs
          scripts/validate-pwa-integration.mjs
          scripts/validate-question-module.mjs
          sw.js
          FILES
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/archive-files.txt
          tar -xzf /tmp/tdas-final-audit.tar.gz

      - name: Validar arquitetura completa
        shell: bash
        run: |
          set -euo pipefail
          npm test
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            node --check "$file"
          done < <(git diff --name-only -- '*.js' '*.mjs')
          grep -q 'Levar resultado ao ChatGPT' assets/integration/question-bank-player.js
          grep -q 'Confirmar que o ChatGPT atualizou o Notion' assets/integration/attempt-export-page-v2.js
          grep -q 'Foco trazido pelo Mentor' revisar/index.html
          grep -q 'pro8' sw.js
          ! grep -Eq 'D\+1.*D\+7.*D\+20' assets/integration/module-store.js

      - name: Materializar somente código funcional
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tdas-audit .tdas-delta
          git config user.name 'tdas-audit[bot]'
          git config user.email 'tdas-audit[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -Eq '^\.tdas-(audit|delta)/'; then
            echo 'Arquivos temporários ainda presentes no commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'TDAS: execução → ChatGPT → Notion (auditado)'
          git push origin HEAD:agent/tdas-execucao-chatgpt-notion-auditada
