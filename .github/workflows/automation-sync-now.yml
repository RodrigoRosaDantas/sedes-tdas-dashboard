name: Executar sincronização isolada TDAS

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'automation/sync-20260730-0333'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/sync-20260730-0333
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sincronizar e validar fora do main
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SYNC_KIND: automation
          TZ: America/Sao_Paulo
        run: |
          set -euo pipefail
          git config user.name 'tdas-notion-sync[bot]'
          git config user.email 'tdas-notion-sync[bot]@users.noreply.github.com'
          node scripts/sync-notion.mjs
          node scripts/validate-platform.mjs
          git rm .github/workflows/automation-sync-now.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Sincronizar integralmente a Plataforma TDAS'
          git push origin HEAD:automation/sync-20260730-0333
