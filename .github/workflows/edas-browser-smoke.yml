name: Validar EDAS no navegador

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'edas-administracao/**'
      - 'assets/styles.css'
      - 'assets/v20.css'
      - 'scripts/test-edas-browser.mjs'
      - 'scripts/test-edas-diagnostic-browser.mjs'
      - 'scripts/test-edas-traceability-browser.mjs'
      - 'scripts/test-edas-operations.mjs'
      - 'scripts/test-edas-traceability.mjs'
      - 'scripts/monitor-edas-publication.mjs'
      - '.github/workflows/edas-browser-smoke.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'edas-administracao/**'
      - 'assets/styles.css'
      - 'assets/v20.css'
      - 'scripts/test-edas-browser.mjs'
      - 'scripts/test-edas-diagnostic-browser.mjs'
      - 'scripts/test-edas-traceability-browser.mjs'
      - 'scripts/test-edas-operations.mjs'
      - 'scripts/test-edas-traceability.mjs'
      - 'scripts/monitor-edas-publication.mjs'
      - '.github/workflows/edas-browser-smoke.yml'
      - 'package.json'
  schedule:
    - cron: '50 10 * * *'

permissions:
  contents: read

concurrency:
  group: edas-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Executar gates estruturais
        run: |
          npm run check:edas
          npm run test:edas-operations

      - name: Preparar site local
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/edas-site/sedes-tdas-dashboard
          cp -a . /tmp/edas-site/sedes-tdas-dashboard/
          cd /tmp/edas-site
          python3 -m http.server 4173 >/tmp/edas-server.log 2>&1 &
          echo $! >/tmp/edas-server.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/sedes-tdas-dashboard/edas-administracao/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/edas-server.log >&2
          exit 1

      - name: Validar navegação, diagnóstico, rastreabilidade, questões, correção e PWA
        env:
          EDAS_BASE_URL: http://127.0.0.1:4173/sedes-tdas-dashboard/edas-administracao
          CHROME_BIN: google-chrome
        run: npm run test:edas-browser

      - name: Encerrar servidor
        if: always()
        run: kill "$(cat /tmp/edas-server.pid 2>/dev/null)" 2>/dev/null || true
