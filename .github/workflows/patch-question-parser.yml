name: Aplicar correção controlada do parser

on:
  push:
    branches:
      - agent/padronizar-versao-publicacao
    paths:
      - '.github/workflows/patch-question-parser.yml'

permissions:
  contents: write

concurrency:
  group: patch-question-parser
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: agent/padronizar-versao-publicacao
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar patch e testar
        run: |
          set -euo pipefail
          node scripts/patch-question-section-scope.mjs
          npm run test:daily-content

      - name: Publicar correção na branch
        run: |
          set -euo pipefail
          git config user.name 'tdas-parser-fix[bot]'
          git config user.email 'tdas-parser-fix[bot]@users.noreply.github.com'
          git add scripts/notion/daily-content.mjs scripts/test-daily-content.mjs
          git commit -m 'Limitar parser à seção oficial de questões'
          git push origin HEAD:agent/padronizar-versao-publicacao
