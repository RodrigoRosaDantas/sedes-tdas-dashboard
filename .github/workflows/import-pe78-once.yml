name: Importar conteúdo real do PE78

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/import-pe78-once.yml'

permissions:
  contents: write

concurrency:
  group: import-pe78-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnosticar acesso às duas raízes oficiais
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOTION_TOKEN"
          check_root() {
            local label="$1" id="$2" status
            status="$(curl -sS -o /tmp/notion-root.json -w '%{http_code}' \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H 'Notion-Version: 2022-06-28' \
              "https://api.notion.com/v1/blocks/$id/children?page_size=1")"
            printf '%s=%s\n' "$label" "$status"
            if [[ "$status" != '200' ]]; then
              jq -c '{status,code,message,additional_data}' /tmp/notion-root.json || true
            fi
            [[ "$status" == '200' ]]
          }
          material_ok=0
          questions_ok=0
          check_root materiais 364cf5a26731813ca00ed9ba45ab6d51 || material_ok=$?
          check_root questoes 364cf5a267318105abdbce6966704b5d || questions_ok=$?
          if [[ "$material_ok" != '0' || "$questions_ok" != '0' ]]; then
            echo 'Uma ou mais raízes ainda não estão compartilhadas com TDAS Dashboard Sync.' >&2
            exit 1
          fi
      - name: Consultar Notion e gerar o PE78
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SYNC_KIND: workflow_dispatch
          TZ: America/Sao_Paulo
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-calendar-refresh.mjs
          node scripts/sync-notion.mjs
          node scripts/postprocess-v23.mjs
          node scripts/postprocess-v24.mjs
          node scripts/postprocess-v26.mjs
          REQUIRE_CURRENT_SNAPSHOT=true node scripts/validate-calendar-snapshot.mjs
      - name: Validar material, catálogo e correção separados
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const catalog=JSON.parse(await fs.readFile('data/integration/question-catalog.json','utf8'));
          const material=JSON.parse(await fs.readFile('data/integration/daily-material.json','utf8'));
          const state=JSON.parse(await fs.readFile('data/notion/state.json','utf8'));
          if(catalog.mode!=='notion-daily') throw new Error(`Catálogo não importado: ${catalog.mode}`);
          if(catalog.peId!=='PE78') throw new Error(`PE inesperado: ${catalog.peId}`);
          if(catalog.questionCount!==48||catalog.questions?.length!==48) throw new Error(`Quantidade inesperada: ${catalog.questionCount}`);
          if(material.mode!=='notion-daily-material'||material.peId!=='PE78'||material.html?.length<200) throw new Error('Material do PE78 ausente ou incompleto.');
          if(!catalog.keyPath) throw new Error('Caminho da correção ausente.');
          const key=JSON.parse(await fs.readFile(catalog.keyPath,'utf8'));
          if(key.answers?.length!==48||key.material_id!==catalog.catalogId) throw new Error('Correção separada incompatível.');
          if(state.dailyContent?.status==='pending_permission') throw new Error('As raízes ainda aguardam compartilhamento com TDAS Dashboard Sync.');
          const forbidden=['answers','gabarito','comentarios','comentários','fundamentos'];
          for(const field of forbidden) if(Object.prototype.hasOwnProperty.call(catalog,field)) throw new Error(`Campo público proibido: ${field}`);
          console.log(JSON.stringify({importacao:'ok',pe:catalog.peId,questoes:catalog.questionCount,respostasSeparadas:key.answers.length,materialHtml:material.html.length,correcaoNoCatalogo:false}));
          NODE
          npm run check
      - name: Consolidar arquivos gerados na branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/import-pe78-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração gerada para publicação.' >&2
            exit 1
          fi
          git commit -m 'Importar conteúdo diário real do PE78'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
