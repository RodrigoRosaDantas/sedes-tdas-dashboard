name: Aplicar correção dinâmica das partes de erros

on:
  push:
    branches:
      - fix/validar-partes-erros-dinamicas

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção mínima
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-platform.mjs')
          text = path.read_text(encoding='utf-8')

          old = "const sw = await fs.readFile(path.join(ROOT, 'sw.js'), 'utf8');"
          new = "const errorIndexForSw = await readJson('data/error-questions/index.json');\nconst sw = await fs.readFile(path.join(ROOT, 'sw.js'), 'utf8');"
          if text.count(old) != 1:
              raise SystemExit('Ponto de inserção do índice não encontrado de forma única.')
          text = text.replace(old, new, 1)

          old = "    ...Array.from({length: 10}, (_, index) => BASE + `data/error-questions/part-${String(index + 1).padStart(2, '0')}.json`),"
          new = "    ...(errorIndexForSw.parts || []).map(part => BASE + `data/error-questions/${part.file}`),"
          if text.count(old) != 1:
              raise SystemExit('Contagem fixa de partes não encontrada de forma única.')
          text = text.replace(old, new, 1)

          old = "const errorIndex = await readJson('data/error-questions/index.json');"
          new = "const errorIndex = errorIndexForSw;"
          if text.count(old) != 1:
              raise SystemExit('Leitura posterior do índice não encontrada de forma única.')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/apply-dynamic-error-parts-fix.yml
          node --check scripts/validate-platform.mjs
          git config user.name 'tdas-fix[bot]'
          git config user.email 'tdas-fix[bot]@users.noreply.github.com'
          git add scripts/validate-platform.mjs .github/workflows/apply-dynamic-error-parts-fix.yml
          git commit -m 'Validar dinamicamente as partes do caderno de erros'
          git push origin HEAD:fix/validar-partes-erros-dinamicas
