name: Aplicar uso real do módulo

on:
  push:
    branches:
      - agent/ativar-uso-real

permissions:
  contents: write

concurrency:
  group: apply-real-use
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar transição operacional
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tdas-project[bot]'
          git config user.email 'tdas-project[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          def write(path, content):
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          production = {
              "schemaVersion": "1.0.0",
              "mode": "canonical-public-platform",
              "title": "SEDES/DF Questões",
              "rootUrl": "/sedes-df-questoes/",
              "studyUrl": "/sedes-df-questoes/#/estudar",
              "reviewUrl": "/sedes-df-questoes/#/revisar",
              "performanceUrl": "/sedes-df-questoes/#/desempenho",
              "catalogUrl": "/sedes-df-questoes/data/release/catalogo.json",
              "repositoryUrl": "https://github.com/RodrigoRosaDantas/sedes-df-questoes",
              "snapshot": {
                  "date": "2026-08-02",
                  "commit": "01c93edd39042ade0fda88831f6059f163e1dbcc",
                  "questions": 2535,
                  "materials": 63
              },
              "localSession": {
                  "catalogId": "pilot-pe76-2026-tdas",
                  "path": "/sedes-tdas-dashboard/resolver/?pilot=pe76",
                  "officialProgressWrite": False,
                  "notionWriteback": False
              },
              "rules": {
                  "publishedOnly": True,
                  "editorialPendingExcluded": True,
                  "localProgressOnly": True,
                  "notionWriteback": False
              }
          }
          write('data/integration/production.json', json.dumps(production, ensure_ascii=False, indent=2) + '\n')

          write('assets/integration/pilot-catalog.js', r'''import {BASE, escapeHTML} from '../common.js?v=24.1';

const waitForStudyPage = () => new Promise((resolve, reject) => {
  let attempts = 0;
  const check = () => {
    const main = document.querySelector('main');
    if (main?.querySelector('.hero h1')?.textContent.trim() === 'Estudar') return resolve(main);
    if (attempts++ >= 100) return reject(new Error('A página Estudar não ficou pronta para o catálogo.'));
    setTimeout(check, 40);
  };
  check();
});

async function fetchJson(url, label, optional = false) {
  try {
    const response = await fetch(url, {cache: 'no-store'});
    if (!response.ok) throw new Error(`${label} (${response.status})`);
    return response.json();
  } catch (error) {
    if (optional) return null;
    throw error;
  }
}

try {
  const [main, localCatalog, production] = await Promise.all([
    waitForStudyPage(),
    fetchJson(BASE + 'data/integration/pilot/pe76-catalog.json', 'Falha ao carregar sessão local'),
    fetchJson(BASE + 'data/integration/production.json', 'Falha ao carregar contrato de produção'),
  ]);
  const publicCatalog = await fetchJson(production.catalogUrl, 'Falha ao consultar catálogo público', true);
  const questions = Number(publicCatalog?.summary?.questoes || production.snapshot.questions || 0);
  const materials = Number(publicCatalog?.summary?.materiais || production.snapshot.materials || 0);
  const release = String(publicCatalog?.release_version || `snapshot ${production.snapshot.date}`);
  const live = Boolean(publicCatalog);
  const footer = main.querySelector('footer');
  const section = document.createElement('section');
  section.className = 'section';
  section.dataset.productionCatalog = production.mode;
  section.innerHTML = `
    <div class="section-head">
      <div>
        <h2>Estudo real — acervo público</h2>
        <p>Acesse a plataforma canônica de questões já publicadas. Registros em saneamento editorial continuam fora do estudo.</p>
      </div>
      <span class="stamp">${questions.toLocaleString('pt-BR')} questões · ${materials} materiais</span>
    </div>
    <div class="grid three">
      <article class="card panel">
        <small>Fonte canônica</small>
        <h3>${escapeHTML(production.title)}</h3>
        <p>${live ? 'Catálogo público consultado agora.' : `Último snapshot confirmado em ${escapeHTML(production.snapshot.date)}.`} Release: ${escapeHTML(release)}.</p>
      </article>
      <article class="card panel">
        <small>Progresso real</small>
        <h3>Perfil Rodrigo</h3>
        <p>Respostas, erros, marcadas, revisões e desempenho ficam salvos no navegador pela plataforma de questões.</p>
      </article>
      <article class="card panel">
        <small>Proteção editorial</small>
        <h3>Somente conteúdo publicado</h3>
        <p>Nenhuma questão pendente, bloqueada, anulada ou duplicada é liberada por esta integração.</p>
      </article>
    </div>
    <div class="hero-actions">
      <a class="btn primary" href="${production.studyUrl}">Abrir acervo completo</a>
      <a class="btn" href="${production.reviewUrl}">Revisar no acervo</a>
      <a class="btn" href="${production.performanceUrl}">Ver desempenho do acervo</a>
    </div>
    <div class="section-head">
      <div>
        <h2>Sessão local PE76</h2>
        <p>Ferramenta compatível preservada para treino rápido neste dashboard, com histórico separado do acervo canônico.</p>
      </div>
      <span class="stamp">${localCatalog.quantidade_questoes} questões · ${localCatalog.tempo_sugerido_minutos} min</span>
    </div>
    <div class="grid two">
      <article class="card panel">
        <small>Recorte local</small>
        <h3>Questões 1–6 e 13–16</h3>
        <p>Assistência Social, SUAS e Língua Portuguesa aplicada.</p>
      </article>
      <article class="card panel">
        <small>Persistência protegida</small>
        <h3>Uso no dispositivo</h3>
        <p>Tentativas finalizadas, caderno e revisões ficam no navegador. O Notion e o progresso oficial não são alterados.</p>
      </article>
    </div>
    <div class="hero-actions"><a class="btn" href="${BASE}resolver/?pilot=pe76">Iniciar sessão local</a></div>
    <details class="card panel">
      <summary><strong>Ver as dez questões disponíveis na sessão local</strong></summary>
      <div class="grid portal-grid">${localCatalog.questoes.map(question => `
        <article class="card portal">
          <small>Questão ${question.numero_original}</small>
          <b>${escapeHTML(question.assunto)}</b>
          <span>${escapeHTML(question.subassunto)}</span>
          <em>Disponível localmente</em>
        </article>`).join('')}
      </div>
    </details>
    <article class="card panel">
      <h3>Separação entre os dois usos</h3>
      <p>O acervo completo é a operação principal. A sessão PE76 continua local para preservar compatibilidade, testes e históricos existentes.</p>
    </article>`;
  footer?.before(section);
} catch (error) {
  console.error('Falha ao preparar o estudo real', error);
}
''')

          write('assets/integration/navigation.js', r'''import {BASE, escapeHTML, loadJSON, setupShell, setLoadingError} from '../common.js?v=24.1';

const routeKey = document.documentElement.dataset.integrationRoute;
const FULL_STUDY = '/sedes-df-questoes/#/estudar';
const routeActions = {
  estudar: [
    {href: FULL_STUDY, label: 'Abrir acervo real', primary: true},
    {href: BASE + 'resolver/?pilot=pe76', label: 'Sessão local PE76'},
  ],
  resolver: [{href: BASE + 'estudar/', label: 'Voltar para Estudar'}],
  revisar: [
    {href: '/sedes-df-questoes/#/revisar', label: 'Revisar no acervo real', primary: true},
    {href: BASE + 'caderno-erros/', label: 'Abrir caderno local'},
  ],
  'caderno-erros': [
    {href: BASE + 'questoes-erros/', label: 'Abrir caderno oficial atual', primary: true},
    {href: BASE + 'revisar/', label: 'Voltar para Revisar'},
  ],
  desempenho: [
    {href: '/sedes-df-questoes/#/desempenho', label: 'Desempenho do acervo real', primary: true},
    {href: BASE + 'evolucao/', label: 'Abrir evolução do plano'},
  ],
  'fila-ia': [{href: BASE + 'estudar/', label: 'Voltar para Estudar'}],
};

try {
  const [navigation, shell] = await Promise.all([
    fetch(BASE + 'data/integration/navigation.json', {cache: 'no-store'}).then(response => {
      if (!response.ok) throw new Error(`Falha ao carregar navegação (${response.status})`);
      return response.json();
    }),
    loadJSON('data/more.json'),
  ]);
  const current = navigation.routes.find(route => route.key === routeKey);
  if (!current) throw new Error('Rota de integração não reconhecida.');
  setupShell('mais', shell.meta);
  const actions = routeActions[routeKey] || [{href: BASE, label: 'Voltar ao início'}];
  document.querySelector('main').innerHTML = `
    <section class="hero">
      <span class="kicker">Módulo de questões · uso operacional</span>
      <h1>${escapeHTML(current.title)}</h1>
      <p>${escapeHTML(current.description)}</p>
      <div class="tags">
        <span class="tag">${escapeHTML(current.status)}</span>
        <span class="tag">${escapeHTML(current.safety)}</span>
      </div>
      <div class="hero-actions">${actions.map(action => `<a class="btn ${action.primary ? 'primary' : ''}" href="${action.href}">${escapeHTML(action.label)}</a>`).join('')}</div>
    </section>
    <section class="section">
      <div class="grid two">
        <article class="card panel">
          <h2>Estado operacional</h2>
          <p>${escapeHTML(current.operation)}</p>
        </article>
        <article class="card panel">
          <h2>Proteção do projeto</h2>
          <p>${escapeHTML(current.safetyDetail)}</p>
        </article>
      </div>
    </section>
    <section class="section">
      <div class="section-head"><div><h2>Áreas do módulo</h2><p>Acervo público, recursos locais e trilhas de acompanhamento.</p></div></div>
      <div class="grid portal-grid">${navigation.routes.map(route => `<a class="card portal" href="${route.path}" aria-current="${route.key === routeKey ? 'page' : 'false'}"><small>${escapeHTML(route.status)}</small><b>${escapeHTML(route.title)}</b><span>${escapeHTML(route.description)}</span><em>${route.key === routeKey ? 'Página atual' : 'Abrir →'}</em></a>`).join('')}</div>
    </section>
    <footer class="footer"><span>Módulo de questões · uso operacional</span><span>Snapshot <span data-snapshot></span></span></footer>`;
} catch (error) {
  setLoadingError(error);
}
''')

