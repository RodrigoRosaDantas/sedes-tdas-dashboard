name: Validar Edital TDAS no navegador

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'edital/**'
      - 'resolver/**'
      - 'assets/edital.js'
      - 'assets/edital.css'
      - 'assets/edital-simple.js'
      - 'assets/edital-simple.css'
      - 'assets/integration/edital-diagnostic.js'
      - 'assets/integration/edital-diagnostic.css'
      - 'assets/integration/edital-evidence-runtime.js'
      - 'assets/common.js'
      - 'assets/more.js'
      - 'assets/tdas-mobile-ux.js'
      - 'data/edital-status.json'
      - 'scripts/notion/edital-status.mjs'
      - 'scripts/notion/source-manifest.mjs'
      - 'scripts/postprocess-v26.mjs'
      - 'scripts/preserve-v27-pwa.mjs'
      - 'scripts/sync-platform-version.mjs'
      - 'scripts/test-edital-page.mjs'
      - 'scripts/test-edital-diagnostic.mjs'
      - 'scripts/test-edital-simple-ux.mjs'
      - 'package.json'
      - 'sw.js'
      - '.github/workflows/edital-browser.yml'
  push:
    branches: [main]
    paths:
      - 'edital/**'
      - 'resolver/**'
      - 'assets/edital.js'
      - 'assets/edital.css'
      - 'assets/edital-simple.js'
      - 'assets/edital-simple.css'
      - 'assets/integration/edital-diagnostic.js'
      - 'assets/integration/edital-diagnostic.css'
      - 'assets/integration/edital-evidence-runtime.js'
      - 'assets/common.js'
      - 'assets/more.js'
      - 'assets/tdas-mobile-ux.js'
      - 'data/edital-status.json'
      - 'scripts/notion/edital-status.mjs'
      - 'scripts/notion/source-manifest.mjs'
      - 'scripts/postprocess-v26.mjs'
      - 'scripts/preserve-v27-pwa.mjs'
      - 'scripts/sync-platform-version.mjs'
      - 'scripts/test-edital-page.mjs'
      - 'scripts/test-edital-diagnostic.mjs'
      - 'scripts/test-edital-simple-ux.mjs'
      - 'package.json'
      - 'sw.js'
      - '.github/workflows/edital-browser.yml'

permissions:
  contents: read

concurrency:
  group: edital-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar contrato do Edital
        run: npm run test:edital

      - name: Preparar site e expectativas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tdas-site/sedes-tdas-dashboard
          cp -a . /tmp/tdas-site/sedes-tdas-dashboard/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='/tmp/tdas-site/sedes-tdas-dashboard';
          const data=JSON.parse(fs.readFileSync(`${root}/data/edital-status.json`,'utf8'));
          const {TDAS_SOURCE_MANIFEST}=await import(`file://${root}/scripts/notion/source-manifest.mjs`);
          const expected=Number(TDAS_SOURCE_MANIFEST.editalChecklist.expectedItems||0);
          const total=Number(data.summary.total||0);
          const critical=Number(data.summary.risk?.critical||0);
          const attention=Number(data.summary.risk?.attention||0);
          const unmeasured=data.topics.filter(item=>!(Number(item.measurement?.questions??item.questions)>0)).length;
          const consolidated=data.topics.filter(item=>['strong','stable'].includes(item.risk)).length;
          const review=data.topics.filter(item=>['critical','attention'].includes(item.risk)).length;
          const portuguese=data.topics.filter(item=>item.discipline==='Português').length;
          const block=data.topics.filter(item=>item.block==='Específico Cargo 202').length;
          const norm=value=>String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
          const searchCrase=data.topics.filter(item=>norm(`${item.code} ${item.topic} ${item.discipline} ${item.block} ${item.evidence} ${item.nextAction}`).includes('crase')).length;
          if(!expected||total!==expected)throw new Error(`Total inesperado do edital: ${total}; esperado ${expected}`);
          if(!block||!searchCrase||!unmeasured)throw new Error('Smoke exige Cargo 202, busca por crase e tópicos sem bateria.');
          if(review!==critical+attention)throw new Error('Visão Revisar não recompõe críticos + atenção.');
          fs.writeFileSync('/tmp/edital-expected.env',`TOTAL=${total}\nCRITICAL=${critical}\nATTENTION=${attention}\nUNMEASURED=${unmeasured}\nCONSOLIDATED=${consolidated}\nREVIEW=${review}\nPORTUGUESE=${portuguese}\nBLOCK=${block}\nSEARCH_CRASE=${searchCrase}\n`);
          NODE
          cd /tmp/tdas-site
          python3 -m http.server 4175 >/tmp/edital-server.log 2>&1 &
          echo $! >/tmp/edital-server.pid
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4175/sedes-tdas-dashboard/edital/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/edital-server.log >&2
          exit 1

      - name: Validar página, mobile, filtros e visões em Chrome
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/edital-expected.env
          base='http://127.0.0.1:4175/sedes-tdas-dashboard/edital/'
          chrome=(google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom)
          "${chrome[@]}" "$base" >/tmp/edital.html 2>/tmp/edital.stderr
          "${chrome[@]}" --window-size=390,844 "$base" >/tmp/edital-mobile.html 2>/tmp/edital-mobile.stderr
          "${chrome[@]}" "${base}?view=unmeasured" >/tmp/edital-unmeasured.html 2>/tmp/edital-unmeasured.stderr
          "${chrome[@]}" "${base}?view=attention" >/tmp/edital-attention.html 2>/tmp/edital-attention.stderr
          "${chrome[@]}" "${base}?view=consolidated" >/tmp/edital-consolidated.html 2>/tmp/edital-consolidated.stderr
          "${chrome[@]}" "${base}?view=review" >/tmp/edital-review.html 2>/tmp/edital-review.stderr
          "${chrome[@]}" "${base}?risk=critical" >/tmp/edital-critical.html 2>/tmp/edital-critical.stderr
          "${chrome[@]}" "${base}?discipline=Portugu%C3%AAs" >/tmp/edital-portugues.html 2>/tmp/edital-portugues.stderr
          "${chrome[@]}" "${base}?block=Espec%C3%ADfico%20Cargo%20202" >/tmp/edital-block.html 2>/tmp/edital-block.stderr
          "${chrome[@]}" "${base}?q=crase" >/tmp/edital-search.html 2>/tmp/edital-search.stderr
          grep -q 'Seu edital, sem bagunça' /tmp/edital.html
          grep -q 'Checklist completo do edital' /tmp/edital.html
          grep -q 'Edital inteligente' /tmp/edital.html
          grep -q 'Aferidos' /tmp/edital.html
          grep -q 'Sem bateria' /tmp/edital.html
          grep -q 'Próxima ação' /tmp/edital.html
          grep -q 'Lacunas do Edital' /tmp/edital.html
          grep -q 'Tópicos ainda sem bateria oficial' /tmp/edital.html
          grep -q 'O site não grava mais aproveitamento privado por tópico' /tmp/edital.html
          grep -q 'Praticar no Banco' /tmp/edital.html
          grep -q 'Resolver uma bateria no site não altera estes indicadores' /tmp/edital.html
          grep -q 'Filtros avançados' /tmp/edital.html
          grep -q 'Entender os números e ver por disciplina' /tmp/edital.html
          grep -q 'Ausência de bateria não é 0%' /tmp/edital.html
          grep -q 'TDAS202:' /tmp/edital.html
          ! grep -Eqi 'Tentativas auxiliares|Aferidos privadamente|percentual privado.*[0-9]|Sincronizado.*tentativa' /tmp/edital.html
          grep -q "${TOTAL} tópicos" /tmp/edital.html
          grep -q "${TOTAL} de ${TOTAL} itens" /tmp/edital.html
          grep -q "${UNMEASURED} de ${TOTAL} itens" /tmp/edital-unmeasured.html
          grep -q "${ATTENTION} de ${TOTAL} itens" /tmp/edital-attention.html
          grep -q "${CONSOLIDATED} de ${TOTAL} itens" /tmp/edital-consolidated.html
          grep -q "${REVIEW} de ${TOTAL} itens" /tmp/edital-review.html
          grep -q "${CRITICAL} de ${TOTAL} itens" /tmp/edital-critical.html
          grep -q "${PORTUGUESE} de ${TOTAL} itens" /tmp/edital-portugues.html
          grep -q "${BLOCK} de ${TOTAL} itens" /tmp/edital-block.html
          grep -q "${SEARCH_CRASE} de ${TOTAL} itens" /tmp/edital-search.html
          grep -q 'Abrir análise no Notion' /tmp/edital.html
          grep -q 'Abrir banco' /tmp/edital.html
          grep -q 'Check do Edital</b><small>Cobertura' /tmp/edital.html
          grep -q '>Mais</span>' /tmp/edital-mobile.html
          grep -q 'Edital</b>' /tmp/edital-mobile.html
          ! grep -Eqi 'Carregando o edital|Não foi possível carregar esta página|Snapshot parcial' /tmp/edital.html /tmp/edital-mobile.html
          ! grep -Eqi 'Uncaught (TypeError|ReferenceError|SyntaxError)' /tmp/edital*.stderr
          printf '{"editalBrowser":"ok","total":%s,"critical":%s,"attention":%s,"unmeasured":%s,"consolidated":%s,"review":%s,"portuguese":%s,"block":%s,"searchCrase":%s,"officialGapQueue":true,"privateHistory":false,"simplifiedUx":true,"mobile":true,"filters":true,"views":true}\n' "$TOTAL" "$CRITICAL" "$ATTENTION" "$UNMEASURED" "$CONSOLIDATED" "$REVIEW" "$PORTUGUESE" "$BLOCK" "$SEARCH_CRASE"

      - name: Diagnosticar falha
        if: failure()
        shell: bash
        run: |
          cat /tmp/edital-expected.env 2>/dev/null || true
          for file in /tmp/edital.html /tmp/edital-mobile.html /tmp/edital-unmeasured.html /tmp/edital-attention.html /tmp/edital-consolidated.html /tmp/edital-review.html /tmp/edital-critical.html /tmp/edital-portugues.html /tmp/edital-block.html /tmp/edital-search.html; do
            [[ -f "$file" ]] || continue
            echo "=== $file ==="
            grep -Eo '[0-9]+ de [0-9]+ itens|Não foi possível carregar esta página|Snapshot parcial|Seu edital, sem bagunça|Próxima ação|Lacunas do Edital|Tópicos ainda sem bateria oficial|Praticar no Banco|Aferidos|Sem bateria|Check do Edital</b>|Edital</b>|>Mais</span>' "$file" | head -50 || true
          done
          for file in /tmp/edital*.stderr; do
            [[ -f "$file" ]] || continue
            echo "=== $file ==="
            tail -80 "$file" || true
          done

      - name: Encerrar servidor
        if: always()
        run: kill "$(cat /tmp/edital-server.pid 2>/dev/null)" 2>/dev/null || true
