name: Expandir formatos diários restantes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/expandir-formatos-diarios.yml'

permissions:
  contents: write

concurrency:
  group: expandir-formatos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Adaptar parser, player e validadores
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_block(source, start, end, replacement, label):
              begin = source.find(start)
              if begin < 0:
                  raise SystemExit(f'{label}: início não localizado')
              finish = source.find(end, begin)
              if finish < 0:
                  raise SystemExit(f'{label}: fim não localizado')
              return source[:begin] + replacement + source[finish:]

          daily = Path('scripts/notion/daily-content.mjs')
          source = daily.read_text(encoding='utf-8')
          source = replace_block(source, 'function questionSegments(markdown) {', '\nfunction parseQuestionBody(body) {', r'''function questionSegments(markdown) {
            const source = String(markdown ?? '').replace(/\r/g, '');
            const matches = [...source.matchAll(/^(?:##\s+Quest(?:ão|ao)\s+(\d+)\s*|\*\*(\d{1,3})\.\*\*\s*(.*))$/gim)];
            return matches.map((match, index) => {
              const inlineStem = String(match[3] ?? '').trim();
              const tail = source.slice(match.index + match[0].length, matches[index + 1]?.index ?? source.length)
                .split(/\n#\s+\d+\.[^\n]*/)[0]
                .trim();
              return {
                number: Number(match[1] || match[2]),
                body: `${inlineStem}${inlineStem && tail ? '\n' : ''}${tail}`.trim()
              };
            });
          }
''', 'segmentação de questões')
          source = replace_block(source, 'function parseQuestionBody(body) {', '\nfunction parseAnswerKey(markdown) {', r'''function parseQuestionBody(body) {
            const lines = String(body ?? '').split('\n');
            const stem = [];
            const alternatives = {};
            let currentOption = null;
            for (const raw of lines) {
              const line = raw.trim();
              if (!line || /^#{1,4}\s+/.test(line) || /^---+$/.test(line)) continue;
              const option = line.match(/^([A-E])\)\s*(.*)$/);
              if (option) {
                currentOption = option[1];
                alternatives[currentOption] = option[2].trim();
                continue;
              }
              if (currentOption) alternatives[currentOption] = `${alternatives[currentOption]} ${line}`.trim();
              else stem.push(line);
            }
            const optionKeys = OPTION_KEYS.filter(option => Object.hasOwn(alternatives, option));
            return {
              enunciado: cleanQuestionText(stem.join(' ')),
              alternativas: Object.fromEntries(optionKeys.map(option => [option, cleanQuestionText(alternatives[option])]))
            };
          }
''', 'leitura do corpo da questão')
          source = replace_block(source, 'function parseAnswerKey(markdown) {', '\nexport function parseDailyQuestions', r'''function parseAnswerKey(markdown) {
            const source = String(markdown ?? '').replace(/\r/g, '');
            const start = source.search(/^#\s+[^\n]*Gabarito[^\n]*$/im);
            if (start < 0) return new Map();
            const tail = source.slice(start);
            const next = tail.slice(1).search(/^#\s+\d+\.[^\n]*$/m);
            const section = next >= 0 ? tail.slice(0, next + 1) : tail;
            const key = new Map();
            const add = (number, answer) => {
              if (key.has(number) && key.get(number) !== answer) throw new Error(`Gabarito divergente para a questão ${number}.`);
              key.set(number, answer);
            };
            for (const match of section.matchAll(/\b(\d{1,3})\s*[-–—]\s*([A-E])\b/g)) add(Number(match[1]), match[2]);
            for (const match of section.matchAll(/<tr>\s*<td>\s*(\d{1,3})\s*<\/td>\s*<td>\s*([A-E])\s*<\/td>\s*<\/tr>/gi)) add(Number(match[1]), match[2].toUpperCase());
            return key;
          }

          export function parseDailyQuestions''', 'leitura do gabarito')
          old = "    for (const option of OPTION_KEYS) required(parsed.alternativas[option]?.length > 0, `${pe}: questão ${segment.number} sem alternativa ${option}.`);"
          new = "    const optionKeys = Object.keys(parsed.alternativas);\n    required(optionKeys.length >= 2 && optionKeys.length <= OPTION_KEYS.length, `${pe}: questão ${segment.number} deve possuir entre duas e cinco alternativas.`);\n    required(optionKeys.join('') === OPTION_KEYS.slice(0, optionKeys.length).join(''), `${pe}: questão ${segment.number} possui alternativas descontínuas.`);\n    for (const option of optionKeys) required(parsed.alternativas[option]?.length > 0, `${pe}: questão ${segment.number} sem conteúdo na alternativa ${option}.`);"
          if old not in source:
              raise SystemExit('Validação fixa A–E não localizada')
          daily.write_text(source.replace(old, new, 1), encoding='utf-8')

          player = Path('assets/integration/module-player.js')
          player_source = player.read_text(encoding='utf-8')
          old_player = '${ANSWER_OPTIONS.map(option => `<label class="pilot-option"><input type="radio" name="module-answer" value="${option}" ${selected === option ? \'checked\' : \'\'}><span><strong>${option})</strong> ${escapeHTML(question.alternativas?.[option] || \'\')}</span></label>`).join(\'\')}'
          new_player = '${ANSWER_OPTIONS.filter(option => question.alternativas?.[option]).map(option => `<label class="pilot-option"><input type="radio" name="module-answer" value="${option}" ${selected === option ? \'checked\' : \'\'}><span><strong>${option})</strong> ${escapeHTML(question.alternativas[option])}</span></label>`).join(\'\')}'
          if old_player not in player_source:
              raise SystemExit('Renderização fixa das alternativas não localizada')
          player.write_text(player_source.replace(old_player, new_player, 1), encoding='utf-8')

          validator = Path('scripts/validate-daily-content.mjs')
          validator_source = validator.read_text(encoding='utf-8')
          old_validator = "  required(JSON.stringify(Object.keys(question.alternativas||{}).sort())===JSON.stringify(['A','B','C','D','E']),`${question.id} não possui somente alternativas A–E`);\n  required(['A','B','C','D','E'].every(option=>question.alternativas?.[option]),`${question.id} sem cinco alternativas`);"
          new_validator = "  const optionKeys=Object.keys(question.alternativas||{}).sort();\n  required(optionKeys.length>=2&&optionKeys.length<=5,`${question.id} deve possuir entre duas e cinco alternativas`);\n  required(JSON.stringify(optionKeys)===JSON.stringify(['A','B','C','D','E'].slice(0,optionKeys.length)),`${question.id} possui alternativas descontínuas`);\n  required(optionKeys.every(option=>question.alternativas?.[option]),`${question.id} possui alternativa vazia`);"
          if old_validator not in validator_source:
              raise SystemExit('Validação diária fixa não localizada')
          validator.write_text(validator_source.replace(old_validator, new_validator, 1), encoding='utf-8')

          audit = Path('scripts/audit-daily-cycle.mjs')
          audit_source = audit.read_text(encoding='utf-8')
          old_audit = "    required(Object.keys(question.alternativas || {}).join('') === 'ABCDE', `${pe}: alternativas incompletas em ${question.id}.`);"
          new_audit = "    const optionKeys = Object.keys(question.alternativas || {});\n    required(optionKeys.length >= 2 && optionKeys.length <= 5, `${pe}: quantidade de alternativas inválida em ${question.id}.`);\n    required(optionKeys.join('') === 'ABCDE'.slice(0, optionKeys.length), `${pe}: alternativas descontínuas em ${question.id}.`);"
          if old_audit not in audit_source:
              raise SystemExit('Auditoria fixa A–E não localizada')
          audit.write_text(audit_source.replace(old_audit, new_audit, 1), encoding='utf-8')

          tests = Path('scripts/test-daily-content.mjs')
          test_source = tests.read_text(encoding='utf-8')
          marker = "\nconst html=renderMaterialMarkdown(`"
          fixture = r'''
          const binaryMarkdown = `# 2. Questões
          ## Arquivologia — Questões 1 a 2
          **1.** Documento arquivístico possui vínculo orgânico com a atividade do produtor.
          A) Certo
          B) Errado
          **2.** Protocolo corresponde somente ao carimbo de entrada.
          A) Certo
          B) Errado
          ---
          # 3. Gabarito
          <table>
          <tr><td>Questão</td><td>Gabarito</td></tr>
          <tr><td>1</td><td>A</td></tr>
          <tr><td>2</td><td>B</td></tr>
          </table>
          # 4. Comentários estratégicos
          Não importar.`;
          const {catalog:binaryCatalog,key:binaryKey}=parseDailyQuestions(binaryMarkdown,{pe:'PE79',title:'Arquivologia',expectedCount:2,sourcePageId:'def'});
          assert.deepEqual(Object.keys(binaryCatalog.questions[0].alternativas),['A','B']);
          assert.equal(binaryCatalog.questions[0].enunciado,'Documento arquivístico possui vínculo orgânico com a atividade do produtor.');
          assert.equal(binaryKey.answers[0].gabarito,'A');
          assert.equal(binaryKey.answers[1].gabarito,'B');
          assert.ok(!JSON.stringify(binaryCatalog).includes('Gabarito'));
          '''
          if marker not in test_source:
              raise SystemExit('Ponto de inserção do teste C/E não localizado')
          tests.write_text(test_source.replace(marker, '\n' + fixture + marker, 1), encoding='utf-8')
          PY

      - name: Validar todos os formatos e o ciclo
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TZ: America/Sao_Paulo
          AUDIT_FROM_PE: '79'
          AUDIT_TO_PE: '112'
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run audit:daily-cycle

      - name: Consolidar correção validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/expandir-formatos-diarios.yml
          git add -A
          git commit -m 'Aceitar formatos C/E e múltipla escolha no ciclo diário'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
