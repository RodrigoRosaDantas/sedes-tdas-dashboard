name: Preservar telemetria local após sync

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Sincronizar Plataforma TDAS v28']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: tdas-telemetry-pwa-preserve
  cancel-in-progress: false

jobs:
  preserve:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restaurar telemetria local no PWA
        run: node scripts/preserve-local-telemetry-pwa.mjs
      - name: Restaurar histórico privado no PWA
        run: node scripts/preserve-private-history-pwa.mjs
      - name: Preservar espelho completo do Notion no PWA
        run: node scripts/preserve-notion-mirror-pwa.mjs
      - name: Validar contrato local
        run: node scripts/validate-local-telemetry.mjs
      - name: Publicar somente se o gerador removeu o precache
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- sw.js; then
            echo 'PWA já preserva telemetria, histórico privado e espelho Notion.'
            exit 0
          fi
          git config user.name 'tdas-telemetry-guard[bot]'
          git config user.email 'tdas-telemetry-guard[bot]@users.noreply.github.com'
          git add sw.js
          git commit -m 'Preservar telemetria, histórico privado e espelho Notion no PWA após sync'
          git push origin HEAD:main
