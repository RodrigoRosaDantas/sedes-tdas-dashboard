name: Atualizar dados operacionais TDAS uma vez

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tdas-operational-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      SYNC_KIND: workflow_dispatch
      FORCE_REBUILD: 'true'
      TDAS_OPERATIONAL_ONLY: 'true'
      TZ: America/Sao_Paulo
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Habilitar fallback operacional somente nesta execução
        shell: bash
        run: |
          cp scripts/sync-notion.mjs /tmp/sync-notion.mjs.original
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/sync-notion.mjs')
          text = p.read_text()
          old = """} catch (failure) {
            if (!isDailyContentPermissionError(failure)) throw failure;
            daily = pendingDailyContent(controls);
            console.warn(`Conteúdo diário aguardando permissão: ${failure.message}`);
          }
          """
          new = """} catch (failure) {
            const operationalFallback = process.env.TDAS_OPERATIONAL_ONLY === 'true';
            if (!isDailyContentPermissionError(failure) && !operationalFallback) throw failure;
            daily = pendingDailyContent(controls);
            if (operationalFallback && !isDailyContentPermissionError(failure)) {
              daily.semantic = previousState.dailyContent || daily.semantic;
              daily.warning = `Dados operacionais atualizados; conteúdo diário anterior preservado porque a validação atual falhou: ${failure.message}`;
              console.warn(daily.warning);
            } else {
              console.warn(`Conteúdo diário aguardando permissão: ${failure.message}`);
            }
          }
          """
          if old not in text:
              raise SystemExit('Bloco de fallback esperado não encontrado; atualização cancelada com segurança.')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Sincronizar fontes operacionais válidas
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-notion.mjs
          node scripts/postprocess-v23.mjs
          node scripts/postprocess-v24.mjs
          node scripts/postprocess-v26.mjs
          node scripts/postprocess-redactions.mjs
          REQUIRE_REDACTIONS_PUBLICATION=true node scripts/validate-redactions-publication.mjs
          node scripts/sync-platform-version.mjs
          node scripts/sync-tdas-master-question-bank.mjs
          node scripts/preserve-private-history-pwa.mjs
          node scripts/preserve-local-telemetry-pwa.mjs
          node scripts/preserve-notion-mirror-pwa.mjs
          node scripts/preserve-v27-pwa.mjs
          node scripts/validate-master-question-bank.mjs
          node scripts/test-control-normalization.mjs
          node scripts/test-sync-operational-guards.mjs
          node scripts/validate-platform-version.mjs
          node scripts/validate-pwa-integration.mjs

      - name: Restaurar código e publicar somente dados validados
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/sync-notion.mjs.original scripts/sync-notion.mjs
          git config user.name 'tdas-operational-refresh[bot]'
          git config user.email 'tdas-operational-refresh[bot]@users.noreply.github.com'
          git add data pe materias sw.js
          if git diff --cached --quiet; then
            echo 'Nenhuma mudança operacional para publicar.'
            exit 0
          fi
          if ! git diff --quiet -- scripts/sync-notion.mjs; then
            echo 'Código temporário não foi restaurado; publicação cancelada.' >&2
            exit 1
          fi
          git commit -m 'Atualizar dados operacionais TDAS a partir do Notion'
          git pull --rebase origin main
          git push origin HEAD:main
