name: Monitorar publicação diária TDAS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Sincronizar Plataforma TDAS v26']
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tdas-publication-watchdog.yml'
      - 'scripts/monitor-tdas-publication.mjs'
  schedule:
    - cron: '20 5,11,17,23 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: tdas-publication-watchdog
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar motor do watchdog
        if: github.event_name == 'pull_request'
        env:
          MONITOR_SELF_TEST: 'true'
        run: node scripts/monitor-tdas-publication.mjs

      - name: Verificar publicação técnica vigente
        if: github.event_name != 'pull_request'
        id: publication
        continue-on-error: true
        env:
          TZ: America/Sao_Paulo
          MAX_SYNC_AGE_MINUTES: '180'
          MONITOR_REPORT_PATH: /tmp/tdas-publication-monitor.json
        run: node scripts/monitor-tdas-publication.mjs

      - name: Manter incidente técnico único
        if: github.event_name != 'pull_request' && always()
        uses: actions/github-script@v7
        env:
          MONITOR_REPORT_PATH: /tmp/tdas-publication-monitor.json
        with:
          script: |
            const fs = require('fs');
            const title = '[Monitor] Site TDAS sem publicação atual do dia';
            const legacyTitles = new Set([title, '[Monitor] Publicação diária TDAS atrasada']);
            const reportPath = process.env.MONITOR_REPORT_PATH;
            if (!fs.existsSync(reportPath)) {
              core.setFailed('O watchdog não gerou o relatório esperado.');
              return;
            }
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sourceRun = context.eventName === 'workflow_run' ? context.payload.workflow_run : null;
            const sourceRunSection = sourceRun
              ? `\n\n- **Execução originadora:** [${sourceRun.name} #${sourceRun.run_number}](${sourceRun.html_url}) — evento ${sourceRun.event}; conclusão ${sourceRun.conclusion || sourceRun.status}; ID ${sourceRun.id}.`
              : '';
            const body = `${report.markdown}${sourceRunSection}\n\n[Consultar execução do monitor](${runUrl})`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const existing = issues
              .filter(issue => !issue.pull_request && legacyTitles.has(issue.title))
              .sort((left, right) => right.number - left.number)[0];

            if (!report.healthy) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title,
                  body,
                  state: 'open'
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body
                });
              }
              core.warning(report.summary);
              return;
            }

            if (existing?.state === 'open') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `✅ Recuperação técnica do site confirmada em ${report.checkedAtLocal}. ${report.summary}${sourceRunSection}\n\n[Consultar execução do monitor](${runUrl})`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                state: 'closed'
              });
            } else if (existing && existing.title !== title) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title
              });
            }
            core.info(report.summary);

      - name: Sinalizar publicação técnica inconsistente
        if: github.event_name != 'pull_request' && steps.publication.outcome == 'failure'
        run: exit 1
