name: Monitorar publicação diária TDAS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Sincronizar Plataforma TDAS v28']
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tdas-publication-watchdog.yml'
      - 'index.html'
      - 'mentor/**'
      - 'assets/mentor.js'
      - 'assets/mentor.css'
      - 'assets/integration/mentor-engine.js'
      - 'assets/integration/mentor-ux.js'
      - 'assets/tdas-mobile-ux.js'
      - 'assets/tdas-mobile-ux.css'
      - 'assets/dashboard-pro-2026.css'
      - 'assets/integration/home-dashboard-pro-2026.js'
      - 'assets/tdas-pro-modules.js'
      - 'assets/tdas-pro-modules.css'
      - 'assets/tdas-command-palette.js'
      - 'assets/tdas-command-palette.css'
      - 'sw.js'
      - 'scripts/postprocess-v26.mjs'
      - 'scripts/sync-platform-version.mjs'
      - 'scripts/monitor-tdas-publication.mjs'
      - 'scripts/monitor-live-site.mjs'
      - 'scripts/monitor-tdas-shell.mjs'
      - 'scripts/http-monitor.mjs'
      - 'scripts/test-monitor-http-timeout.mjs'
      - 'scripts/test-site-operations.mjs'
      - 'data/platform-version.json'
      - 'data/redactions.json'
      - 'data/redactions/**'
      - 'package.json'
      - 'docs/OPERACAO_SITE_TDAS.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tdas-publication-watchdog.yml'
      - 'index.html'
      - 'mentor/**'
      - 'assets/mentor.js'
      - 'assets/mentor.css'
      - 'assets/integration/mentor-engine.js'
      - 'assets/integration/mentor-ux.js'
      - 'assets/tdas-mobile-ux.js'
      - 'assets/tdas-mobile-ux.css'
      - 'assets/dashboard-pro-2026.css'
      - 'assets/integration/home-dashboard-pro-2026.js'
      - 'assets/tdas-pro-modules.js'
      - 'assets/tdas-pro-modules.css'
      - 'assets/tdas-command-palette.js'
      - 'assets/tdas-command-palette.css'
      - 'sw.js'
      - 'scripts/postprocess-v26.mjs'
      - 'scripts/sync-platform-version.mjs'
      - 'scripts/monitor-tdas-publication.mjs'
      - 'scripts/monitor-live-site.mjs'
      - 'scripts/monitor-tdas-shell.mjs'
      - 'scripts/http-monitor.mjs'
      - 'scripts/test-monitor-http-timeout.mjs'
      - 'scripts/test-site-operations.mjs'
      - 'package.json'
  schedule:
    - cron: '20 5,11,17,23 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: tdas-publication-watchdog-v2
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar motores do watchdog
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          npm run test:monitor-http
          npm run check:operations
          MONITOR_SELF_TEST=true npm run monitor:publication
          MONITOR_SELF_TEST=true npm run monitor:live-site
          SHELL_MONITOR_SELF_TEST=true npm run monitor:shell

      - name: Verificar publicação técnica vigente
        if: github.event_name != 'pull_request'
        id: publication
        continue-on-error: true
        env:
          TZ: America/Sao_Paulo
          MAX_SYNC_AGE_MINUTES: ${{ github.event_name == 'push' && '480' || '180' }}
          MONITOR_REPORT_PATH: /tmp/tdas-publication-monitor.json
        run: npm run monitor:publication

      - name: Verificar site implantado no GitHub Pages
        if: github.event_name != 'pull_request'
        id: live_site
        continue-on-error: true
        env:
          SITE_BASE_URL: https://rodrigorosadantas.github.io/sedes-tdas-dashboard
          LIVE_SITE_MAX_ATTEMPTS: '10'
          LIVE_SITE_RETRY_DELAY_MS: '10000'
          LIVE_SITE_REQUEST_TIMEOUT_MS: '8000'
          LIVE_SITE_REPORT_PATH: /tmp/tdas-live-site-monitor.json
        run: npm run monitor:live-site

      - name: Verificar paridade da interface TDAS PRO
        if: github.event_name != 'pull_request'
        id: shell
        continue-on-error: true
        env:
          SITE_BASE_URL: https://rodrigorosadantas.github.io/sedes-tdas-dashboard
          SHELL_MONITOR_MAX_ATTEMPTS: '10'
          SHELL_MONITOR_RETRY_DELAY_MS: '10000'
          SHELL_MONITOR_REQUEST_TIMEOUT_MS: '8000'
          SHELL_MONITOR_REPORT_PATH: /tmp/tdas-shell-monitor.json
        run: npm run monitor:shell

      - name: Manter incidente técnico único
        if: github.event_name != 'pull_request' && always()
        uses: actions/github-script@v7
        env:
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
          LIVE_SITE_OUTCOME: ${{ steps.live_site.outcome }}
          SHELL_OUTCOME: ${{ steps.shell.outcome }}
          MONITOR_REPORT_PATH: /tmp/tdas-publication-monitor.json
          LIVE_SITE_REPORT_PATH: /tmp/tdas-live-site-monitor.json
          SHELL_MONITOR_REPORT_PATH: /tmp/tdas-shell-monitor.json
        with:
          script: |
            const fs = require('fs');
            const title = '[Monitor] Site TDAS sem publicação atual do dia';
            const legacyTitles = new Set([title, '[Monitor] Publicação diária TDAS atrasada']);
            const readReport = (file, fallback) => fs.existsSync(file)
              ? JSON.parse(fs.readFileSync(file, 'utf8'))
              : fallback;
            const publication = readReport(process.env.MONITOR_REPORT_PATH, {
              healthy: false,
              summary: 'O monitor técnico não gerou relatório.',
              markdown: '## Monitoramento da publicação técnica TDAS\n\nO relatório local não foi gerado.'
            });
            const liveSite = readReport(process.env.LIVE_SITE_REPORT_PATH, {
              healthy: false,
              summary: 'O monitor do GitHub Pages não gerou relatório.',
              markdown: '## Monitoramento do site implantado\n\nO relatório público não foi gerado.'
            });
            const shell = readReport(process.env.SHELL_MONITOR_REPORT_PATH, {
              healthy: false,
              summary: 'O monitor da interface TDAS PRO não gerou relatório.',
              markdown: '## Paridade da interface TDAS\n\nO relatório da camada estática não foi gerado.'
            });
            const healthy = process.env.PUBLICATION_OUTCOME === 'success'
              && process.env.LIVE_SITE_OUTCOME === 'success'
              && process.env.SHELL_OUTCOME === 'success'
              && publication.healthy === true
              && liveSite.healthy === true
              && shell.healthy === true;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sourceRun = context.eventName === 'workflow_run' ? context.payload.workflow_run : null;
            const sourceRunSection = sourceRun
              ? `\n\n- **Execução originadora:** [${sourceRun.name} #${sourceRun.run_number}](${sourceRun.html_url}) — evento ${sourceRun.event}; conclusão ${sourceRun.conclusion || sourceRun.status}; ID ${sourceRun.id}.`
              : '';
            const body = `${publication.markdown}\n\n---\n\n${liveSite.markdown}\n\n---\n\n${shell.markdown}${sourceRunSection}\n\n[Consultar execução do monitor](${runUrl})`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const existing = issues
              .filter(issue => !issue.pull_request && legacyTitles.has(issue.title))
              .sort((left, right) => right.number - left.number)[0];

            if (!healthy) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title,
                  body,
                  state: 'open'
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body
                });
              }
              core.warning(`${publication.summary} ${liveSite.summary} ${shell.summary}`);
              return;
            }

            if (existing?.state === 'open') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `✅ Recuperação técnica confirmada. A main e o GitHub Pages servem a mesma publicação, incluindo a camada TDAS PRO, o Banco Discursivo e a proteção da aplicação cega.${sourceRunSection}\n\n[Consultar execução do monitor](${runUrl})`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                state: 'closed'
              });
            } else if (existing && existing.title !== title) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title
              });
            }
            core.info(`${publication.summary} ${liveSite.summary} ${shell.summary}`);

      - name: Sinalizar publicação técnica ou implantação inconsistente
        if: ${{ github.event_name != 'pull_request' && (steps.publication.outcome == 'failure' || steps.live_site.outcome == 'failure' || steps.shell.outcome == 'failure') }}
        run: exit 1
