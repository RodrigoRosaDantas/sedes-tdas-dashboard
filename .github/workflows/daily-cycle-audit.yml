name: Adaptar e auditar ciclo PE79–PE112

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/daily-cycle-audit.yml'

permissions:
  contents: write

concurrency:
  group: adaptar-ciclo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  adapt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar compatibilidade C/E e alternativas variáveis
        run: python scripts/apply-daily-format-patch.py

      - name: Validar plataforma e todos os dias restantes
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TZ: America/Sao_Paulo
          AUDIT_FROM_PE: '79'
          AUDIT_TO_PE: '112'
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run audit:daily-cycle

      - name: Consolidar somente após aprovação integral
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mv .github/workflows/daily-cycle-audit.final.yml .github/workflows/daily-cycle-audit.yml
          rm -f .github/workflows/expandir-formatos-diarios.yml scripts/apply-daily-format-patch.py
          git add -A
          git commit -m 'Aceitar formatos C/E e múltipla escolha no ciclo diário'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
