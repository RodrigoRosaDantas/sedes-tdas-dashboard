name: Reparar caminhos EDAS S12

on:
  pull_request:
    branches:
      - main
    paths:
      - repair-edas-sync-s12.ready

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Corrigir caminhos sem alterar pacote
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/edas-sync-s12.yml')
          text=p.read_text(encoding='utf-8')
          replacements={
            '/tmp/site-new.json':'/tmp/data/site.json',
            '/tmp/sync-history.json':'/tmp/data/sync-history.json',
            '/tmp/daily-material.json':'/tmp/data/integration/daily-material.json',
            '/tmp/question-catalog.json':'/tmp/data/integration/question-catalog.json',
            '/tmp/answer-key.json':'/tmp/data/integration/answer-key.json',
            '/tmp/daily-contract.json':'/tmp/data/integration/daily-contract.json',
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Caminho esperado não encontrado: {old}')
              text=text.replace(old,new)
          p.write_text(text,encoding='utf-8')
          PY
          git config user.name "EDAS Platform Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/edas-sync-s12.yml
          git rm repair-edas-sync-s12.ready .github/workflows/repair-edas-sync-s12.yml
          git commit -m "Corrigir caminhos do pacote S12"
          git push origin HEAD:${{ github.head_ref }}
