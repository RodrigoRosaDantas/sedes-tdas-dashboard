name: Importar PE78 após compartilhamento

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/import-pe78-after-share.yml'

permissions:
  contents: write

concurrency:
  group: import-pe78-share-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirmar acesso às raízes
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOTION_TOKEN"
          for item in \
            'materiais:364cf5a26731813ca00ed9ba45ab6d51' \
            'questoes:364cf5a267318105abdbce6966704b5d'; do
            label="${item%%:*}"
            id="${item#*:}"
            status="$(curl -sS -o "/tmp/${label}.json" -w '%{http_code}' \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H 'Notion-Version: 2022-06-28' \
              "https://api.notion.com/v1/blocks/$id/children?page_size=1")"
            echo "$label=$status"
            if [[ "$status" != '200' ]]; then
              jq -c '{status,code,message,additional_data}' "/tmp/${label}.json" || true
              exit 1
            fi
          done
      - name: Corrigir identificação de páginas diárias
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          module = Path('scripts/notion/daily-content.mjs')
          source = module.read_text(encoding='utf-8')
          old = """const peCode = value => {
            const match = String(value ?? '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').match(/\\bPE\\s*0*(\\d{1,3})\\b/i);
            const number = Number(match?.[1]);
            return Number.isInteger(number) && number >= 1 && number <= PE_LIMIT ? `PE${String(number).padStart(2, '0')}` : null;
          };"""
          new = """export const peCode = value => {
            const match = String(value ?? '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').match(/^\\s*PE\\s*0*(\\d{1,3})\\b(?!\\s*[-–—]\\s*(?:PE\\s*)?0*\\d)/i);
            const number = Number(match?.[1]);
            return Number.isInteger(number) && number >= 1 && number <= PE_LIMIT ? `PE${String(number).padStart(2, '0')}` : null;
          };"""
          if old not in source:
            raise SystemExit('Trecho de peCode não localizado para correção segura.')
          source = source.replace(old, new, 1)

          marker = "export async function discoverDailyPages(root, {expected = PE_LIMIT} = {}) {"
          helper = """export function isAuxiliaryDailyPage(value) {
            const normalized = String(value ?? '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '');
            return /\\bauditoria\\b/i.test(normalized);
          }

          """
          if marker not in source:
            raise SystemExit('Ponto de inserção do filtro auxiliar não localizado.')
          source = source.replace(marker, helper + marker, 1)

          old_candidates = "const candidates = [...direct, ...nestedGroups.flat()].filter(page => peCode(page.title));"
          new_candidates = "const candidates = [...direct, ...nestedGroups.flat()].filter(page => peCode(page.title) && !isAuxiliaryDailyPage(page.title));"
          if old_candidates not in source:
            raise SystemExit('Filtro de candidatos não localizado.')
          source = source.replace(old_candidates, new_candidates, 1)
          module.write_text(source, encoding='utf-8')

          test = Path('scripts/test-daily-content.mjs')
          test_source = test.read_text(encoding='utf-8')
          test_source = test_source.replace(
            "import {parseDailyQuestions, renderMaterialMarkdown} from './notion/daily-content.mjs';",
            "import {isAuxiliaryDailyPage, parseDailyQuestions, peCode, renderMaterialMarkdown} from './notion/daily-content.mjs';",
            1
          )
          test_marker = "\nconst markdown = `"
          assertions = """
          assert.equal(peCode('PE01 — Virada pós-edital'), 'PE01');
          assert.equal(peCode('PE78'), 'PE78');
          assert.equal(peCode('01 — Micro PE01–PE07 | Semana 1'), null);
          assert.equal(peCode('PE01–PE07'), null);
          assert.equal(isAuxiliaryDailyPage('PE27 — Auditoria do simulado parcial 1 + RD08'), true);
          assert.equal(isAuxiliaryDailyPage('PE27 — Simulado parcial 1 + RD08'), false);
          """
          if test_marker not in test_source:
            raise SystemExit('Ponto de inserção dos testes não localizado.')
          test.write_text(test_source.replace(test_marker, assertions + test_marker, 1), encoding='utf-8')
          PY
          node scripts/test-daily-content.mjs
      - name: Gerar conteúdo diário
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SYNC_KIND: workflow_dispatch
          TZ: America/Sao_Paulo
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-calendar-refresh.mjs
          node scripts/sync-notion.mjs
          node scripts/postprocess-v23.mjs
          node scripts/postprocess-v24.mjs
          node scripts/postprocess-v26.mjs
          REQUIRE_CURRENT_SNAPSHOT=true node scripts/validate-calendar-snapshot.mjs
      - name: Validar PE78 integral
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const catalog=JSON.parse(await fs.readFile('data/integration/question-catalog.json','utf8'));
          const material=JSON.parse(await fs.readFile('data/integration/daily-material.json','utf8'));
          const state=JSON.parse(await fs.readFile('data/notion/state.json','utf8'));
          if(catalog.mode!=='notion-daily') throw new Error(`Catálogo não importado: ${catalog.mode}`);
          if(catalog.peId!=='PE78') throw new Error(`PE inesperado: ${catalog.peId}`);
          if(catalog.questionCount!==48||catalog.questions?.length!==48) throw new Error(`Quantidade inesperada: ${catalog.questionCount}`);
          if(material.mode!=='notion-daily-material'||material.peId!=='PE78'||material.html?.length<200) throw new Error('Material do PE78 ausente ou incompleto.');
          if(!catalog.keyPath) throw new Error('Caminho da correção ausente.');
          const key=JSON.parse(await fs.readFile(catalog.keyPath,'utf8'));
          if(key.answers?.length!==48||key.material_id!==catalog.catalogId) throw new Error('Correção separada incompatível.');
          if(state.dailyContent?.pe!=='PE78'||state.dailyContent?.questionCount!==48) throw new Error('Estado diário não consolidou o PE78.');
          for(const question of catalog.questions){
            const allowed=['id','numeroOriginal','assunto','enunciado','alternativas'];
            for(const field of Object.keys(question)) if(!allowed.includes(field)) throw new Error(`Campo público proibido em ${question.id}: ${field}`);
            if(Object.keys(question.alternativas||{}).join('')!=='ABCDE') throw new Error(`Alternativas inválidas em ${question.id}`);
          }
          console.log(JSON.stringify({importacao:'ok',pe:catalog.peId,questoes:48,respostasSeparadas:48,materialHtml:material.html.length,correcaoNoCatalogo:false}));
          NODE
          npm run check
      - name: Consolidar conteúdo validado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/import-pe78-after-share.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração gerada.' >&2
            exit 1
          fi
          git commit -m 'Importar material e questões reais do PE78'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
