name: Validar paridade avançada EDAS

on:
  pull_request:
    branches:
      - main
    paths:
      - edas-advanced.ready

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Obter branch técnica
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruir pacote validado
        shell: bash
        run: |
          set -euo pipefail
          cat edas-advanced.parts/part*.b64 > /tmp/edas-advanced.b64
          base64 --decode /tmp/edas-advanced.b64 > /tmp/edas-advanced.tar.gz
          test "$(sha256sum /tmp/edas-advanced.tar.gz | awk '{print $1}')" = "6c47a4033e9a9d5c036a13205a3a90ec0e6d8f59ed9207b8dbc00727cbd9fe4f"
          tar -xzf /tmp/edas-advanced.tar.gz
          python patch_versions.py

      - name: Validar código, dados e rotas
        shell: bash
        run: |
          set -euo pipefail
          for file in edas-administracao/assets/*.js edas-administracao/assets/integration/*.js; do node --check "$file"; done
          find edas-administracao/data -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null
          python -m json.tool edas-administracao/manifest.webmanifest >/dev/null
          test "$(find edas-administracao -name index.html | wc -l)" -ge 19
          test -f edas-administracao/sprints/index.html
          test -f edas-administracao/sprint/index.html
          test -f edas-administracao/materias/index.html
          test -f edas-administracao/materia/index.html
          test -f edas-administracao/historico/index.html
          test -f edas-administracao/data/integration/daily-contract.json
          test -f edas-administracao/data/integration/daily-material.json
          test -f edas-administracao/data/sync-history.json
          grep -q "20260805.2" edas-administracao/assets/common.js
          grep -q "edas.400.question-module.v2.state" edas-administracao/assets/integration/module-store.js
          ! grep -R "tdas.202.question-module" edas-administracao
          ! grep -R "20260804.1" edas-administracao
          python - <<'PY'
          import json
          from pathlib import Path
          site=json.loads(Path('edas-administracao/data/site.json').read_text(encoding='utf-8'))
          assert len(site.get('sprints',[]))==42, 'snapshot deve preservar 42 Sprints'
          material=json.loads(Path('edas-administracao/data/integration/daily-material.json').read_text(encoding='utf-8'))
          assert material['status']!='ready' or material.get('html'), 'material ready exige html'
          manifest=json.loads(Path('edas-administracao/manifest.webmanifest').read_text(encoding='utf-8'))
          assert manifest['scope']=='/sedes-tdas-dashboard/edas-administracao/'
          assert manifest['id']=='/sedes-tdas-dashboard/edas-administracao/'
          PY

      - name: Consolidar branch técnica
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EDAS Platform Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f patch_versions.py
          git add edas-administracao
          git rm -r --ignore-unmatch edas-advanced.parts edas-advanced.ready .github/workflows/edas-advanced-parity.yml
          git commit -m "Aplicar paridade avançada do TDAS ao EDAS v20260805.2"
          git push origin HEAD:${{ github.head_ref }}
